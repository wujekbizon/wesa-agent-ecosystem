apiVersion: apps/v1
kind: Deployment
metadata:
  name: infra-manager
  namespace: lumio
  labels:
    app: infra-manager
spec:
  replicas: 1
  selector:
    matchLabels:
      app: infra-manager
  template:
    metadata:
      labels:
        app: infra-manager
    spec:
      serviceAccountName: infra-manager-sa
      containers:
        - name: infra-manager
          image: lumio-infra-manager:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8766
          env:
            - name: LUMIO_NAMESPACE
              value: "lumio"
            - name: SERVICES_CONFIG
              value: "/app/configs/services.yaml"
            - name: LOG_LEVEL
              value: "INFO"
