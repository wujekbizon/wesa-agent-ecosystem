# Lumio Network Configuration
# Edit UBUNTU_VM_IP to match your Ubuntu VM's LAN IP.
# All other values are internal Docker network settings.

# The Ubuntu VM's static LAN IP
ubuntu_vm_ip: "192.168.1.62"

# infra_manager — Greg/web monitor control plane
infra_manager:
  host: "0.0.0.0"
  port: 8766
  lan_url: "http://192.168.1.62:30766"

# Ollama on Greg's Windows PC — called by tutor and rag services
ollama:
  lan_url: "http://192.168.1.12:11434"
  embedding_model: "nomic-embed-text"
  tutor_model: "qwen2.5:latest"        # Update to whichever model Greg prefers

# Docker internal network name
docker_network: "lumio_network"

# NAS (future — not active yet)
nas:
  enabled: false
  mount_base: "/mnt/nas"              # Where NAS shares will be mounted per user
