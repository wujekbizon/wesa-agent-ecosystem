<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lumio — Your Learning Space</title>
  <style>
    :root {
      --bg: #0f1117;
      --surface: #1a1d27;
      --surface2: #22263a;
      --border: #2e3350;
      --accent: #6c8ef7;
      --accent-hover: #8aabff;
      --text: #e8eaf6;
      --text-muted: #7986cb;
      --success: #66bb6a;
      --danger: #ef5350;
      --radius: 12px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ---- Login Screen ---- */
    #login-screen {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      gap: 24px;
    }

    .lumio-logo {
      font-size: 3rem;
      font-weight: 800;
      color: var(--accent);
      letter-spacing: -2px;
    }

    .lumio-tagline {
      color: var(--text-muted);
      font-size: 1rem;
    }

    .login-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 36px;
      width: 340px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .login-card label {
      font-size: 0.85rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    .login-card input {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      padding: 12px 14px;
      font-size: 1rem;
      width: 100%;
      outline: none;
      transition: border-color 0.2s;
    }

    .login-card input:focus { border-color: var(--accent); }

    /* ---- App Layout ---- */
    #app { display: none; flex-direction: column; height: 100vh; }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 20px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
    }

    .topbar-logo { font-size: 1.4rem; font-weight: 800; color: var(--accent); }
    .topbar-user { font-size: 0.85rem; color: var(--text-muted); }
    .topbar-stats { font-size: 0.8rem; color: var(--text-muted); }

    .main-layout {
      display: flex;
      flex: 1;
      overflow: hidden;
    }

    /* ---- Sidebar ---- */
    .sidebar {
      width: 280px;
      background: var(--surface);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .sidebar-section {
      padding: 16px;
      border-bottom: 1px solid var(--border);
    }

    .sidebar-title {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--text-muted);
      margin-bottom: 12px;
    }

    .file-list { display: flex; flex-direction: column; gap: 6px; overflow-y: auto; flex: 1; padding: 12px 16px; }

    .file-item {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 12px;
      font-size: 0.85rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .file-name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .file-delete {
      background: none; border: none; color: var(--text-muted);
      cursor: pointer; font-size: 1rem; padding: 2px 6px; border-radius: 4px;
    }
    .file-delete:hover { color: var(--danger); background: rgba(239,83,80,0.1); }

    /* ---- Upload area ---- */
    .upload-area {
      border: 2px dashed var(--border);
      border-radius: 8px;
      padding: 20px;
      text-align: center;
      cursor: pointer;
      transition: border-color 0.2s, background 0.2s;
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .upload-area:hover, .upload-area.drag-over {
      border-color: var(--accent);
      background: rgba(108,142,247,0.05);
      color: var(--accent);
    }

    #file-input { display: none; }

    /* ---- Chat area ---- */
    .chat-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .message {
      display: flex;
      gap: 12px;
      max-width: 80%;
    }

    .message.user { align-self: flex-end; flex-direction: row-reverse; }
    .message.assistant { align-self: flex-start; }

    .message-avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.9rem;
      flex-shrink: 0;
    }

    .message.user .message-avatar { background: var(--accent); color: #fff; }
    .message.assistant .message-avatar { background: var(--surface2); color: var(--accent); border: 1px solid var(--border); }

    .message-bubble {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px 16px;
      font-size: 0.92rem;
      line-height: 1.6;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .message.user .message-bubble {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }

    .typing-indicator .message-bubble { color: var(--text-muted); font-style: italic; }

    /* ---- Input bar ---- */
    .input-bar {
      padding: 16px 20px;
      border-top: 1px solid var(--border);
      display: flex;
      gap: 10px;
      background: var(--surface);
    }

    .input-bar textarea {
      flex: 1;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--text);
      padding: 12px 14px;
      font-size: 0.92rem;
      resize: none;
      outline: none;
      font-family: inherit;
      line-height: 1.5;
      max-height: 120px;
      min-height: 44px;
      transition: border-color 0.2s;
    }

    .input-bar textarea:focus { border-color: var(--accent); }

    /* ---- Buttons ---- */
    .btn {
      padding: 10px 20px;
      border-radius: 8px;
      border: none;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s, opacity 0.2s;
    }

    .btn-primary { background: var(--accent); color: #fff; }
    .btn-primary:hover { background: var(--accent-hover); }
    .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-ghost { background: transparent; color: var(--text-muted); border: 1px solid var(--border); }
    .btn-ghost:hover { border-color: var(--accent); color: var(--accent); }

    /* ---- Empty state ---- */
    .empty-chat {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      flex: 1;
      gap: 12px;
      color: var(--text-muted);
      text-align: center;
      padding: 40px;
    }

    .empty-chat .icon { font-size: 3rem; }
    .empty-chat h3 { font-size: 1.1rem; color: var(--text); }
    .empty-chat p { font-size: 0.85rem; }

    /* ---- Upload progress ---- */
    .upload-status {
      font-size: 0.8rem;
      padding: 8px 12px;
      border-radius: 6px;
      margin-top: 8px;
    }

    .upload-status.success { background: rgba(102,187,106,0.15); color: var(--success); }
    .upload-status.error { background: rgba(239,83,80,0.15); color: var(--danger); }

    /* ---- Scrollbar ---- */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--text-muted); }
  </style>
</head>
<body>

<!-- ============================================================ LOGIN -->
<div id="login-screen">
  <div class="lumio-logo">lumio</div>
  <div class="lumio-tagline">Your personal learning space</div>
  <div class="login-card">
    <label for="username-input">Your name</label>
    <input type="text" id="username-input" placeholder="e.g. emma" autocomplete="off" />
    <button class="btn btn-primary" onclick="login()">Start learning</button>
  </div>
</div>

<!-- ============================================================ APP -->
<div id="app">
  <div class="topbar">
    <div class="topbar-logo">lumio</div>
    <div class="topbar-stats" id="study-stats">Today: 0 min</div>
    <div style="display:flex;gap:10px;align-items:center;">
      <span class="topbar-user" id="user-label"></span>
      <button class="btn btn-ghost" onclick="logout()" style="padding:6px 12px;font-size:0.8rem;">Sign out</button>
    </div>
  </div>

  <div class="main-layout">

    <!-- Sidebar -->
    <div class="sidebar">
      <div class="sidebar-section">
        <div class="sidebar-title">Upload materials</div>
        <div class="upload-area" id="upload-area" onclick="document.getElementById('file-input').click()">
          Drop PDF here or click to browse
        </div>
        <input type="file" id="file-input" accept=".pdf" multiple />
        <div id="upload-status"></div>
      </div>

      <div class="sidebar-section" style="border-bottom:none;flex:1;display:flex;flex-direction:column;overflow:hidden;">
        <div class="sidebar-title">My materials</div>
        <div class="file-list" id="file-list"></div>
      </div>
    </div>

    <!-- Chat -->
    <div class="chat-area">
      <div class="messages" id="messages">
        <div class="empty-chat" id="empty-chat">
          <div class="icon">📚</div>
          <h3>Ready to help you learn</h3>
          <p>Upload a PDF from the sidebar, then ask me anything about it.</p>
        </div>
      </div>
      <div class="input-bar">
        <textarea id="chat-input" placeholder="Ask me anything about your materials..." rows="1"
          onkeydown="handleKey(event)" oninput="autoResize(this)"></textarea>
        <button class="btn btn-primary" id="send-btn" onclick="sendMessage()">Send</button>
      </div>
    </div>

  </div>
</div>

<script>
  let currentUser = null;
  let chatHistory = [];
  let isStreaming = false;
  let msgCounter = 0;

  // ---- Login ----
  function login() {
    const input = document.getElementById('username-input');
    const username = input.value.trim().toLowerCase().replace(/[^a-z0-9_-]/g, '');
    if (!username) return;
    currentUser = username;
    document.getElementById('login-screen').style.display = 'none';
    document.getElementById('app').style.display = 'flex';
    document.getElementById('user-label').textContent = username;
    loadFiles();
    loadStats();
  }

  function logout() {
    fetch('/api/session/end', { method: 'POST', headers: {'Content-Type':'application/json'},
      body: JSON.stringify({username: currentUser}) });
    currentUser = null;
    chatHistory = [];
    document.getElementById('app').style.display = 'none';
    document.getElementById('login-screen').style.display = 'flex';
    document.getElementById('username-input').value = '';
    document.getElementById('messages').innerHTML = `
      <div class="empty-chat" id="empty-chat">
        <div class="icon">📚</div>
        <h3>Ready to help you learn</h3>
        <p>Upload a PDF from the sidebar, then ask me anything about it.</p>
      </div>`;
    document.getElementById('file-list').innerHTML = '';
  }

  document.getElementById('username-input').addEventListener('keydown', e => {
    if (e.key === 'Enter') login();
  });

  // ---- Files ----
  async function loadFiles() {
    const res = await fetch(`/api/files/${currentUser}`);
    const data = await res.json();
    renderFiles(data.files || []);
  }

  function renderFiles(files) {
    const list = document.getElementById('file-list');
    if (!files.length) {
      list.innerHTML = '<div style="color:var(--text-muted);font-size:0.82rem;">No materials yet</div>';
      return;
    }
    list.innerHTML = files.map(f => `
      <div class="file-item">
        <span class="file-name" title="${f.name}">📄 ${f.name}</span>
        <button class="file-delete" onclick="deleteFile('${f.name}')" title="Remove">✕</button>
      </div>
    `).join('');
  }

  async function deleteFile(filename) {
    if (!confirm(`Remove "${filename}"?`)) return;
    await fetch(`/api/files/${currentUser}/${encodeURIComponent(filename)}`, { method: 'DELETE' });
    loadFiles();
  }

  // ---- Upload ----
  const uploadArea = document.getElementById('upload-area');
  const fileInput = document.getElementById('file-input');

  uploadArea.addEventListener('dragover', e => { e.preventDefault(); uploadArea.classList.add('drag-over'); });
  uploadArea.addEventListener('dragleave', () => uploadArea.classList.remove('drag-over'));
  uploadArea.addEventListener('drop', e => {
    e.preventDefault();
    uploadArea.classList.remove('drag-over');
    uploadFiles(e.dataTransfer.files);
  });
  fileInput.addEventListener('change', () => uploadFiles(fileInput.files));

  async function uploadFiles(files) {
    const status = document.getElementById('upload-status');
    for (const file of files) {
      if (!file.name.endsWith('.pdf')) {
        showStatus(`${file.name} is not a PDF`, 'error');
        continue;
      }
      showStatus(`Uploading ${file.name}...`, '');
      const formData = new FormData();
      formData.append('file', file);
      try {
        const res = await fetch(`/api/files/${currentUser}/upload`, { method: 'POST', body: formData });
        if (res.ok) {
          showStatus(`✓ ${file.name} uploaded and indexing started`, 'success');
        } else {
          showStatus(`✗ Failed to upload ${file.name}`, 'error');
        }
      } catch (e) {
        showStatus(`✗ Upload error: ${e.message}`, 'error');
      }
    }
    fileInput.value = '';
    setTimeout(() => loadFiles(), 500);
  }

  function showStatus(msg, type) {
    const el = document.getElementById('upload-status');
    el.textContent = msg;
    el.className = `upload-status ${type}`;
    if (type === 'success') setTimeout(() => el.textContent = '', 4000);
  }

  // ---- Chat ----
  function handleKey(e) {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
  }

  function autoResize(el) {
    el.style.height = 'auto';
    el.style.height = Math.min(el.scrollHeight, 120) + 'px';
  }

  function addMessage(role, content) {
    const empty = document.getElementById('empty-chat');
    if (empty) empty.remove();

    const msgs = document.getElementById('messages');
    const id = `msg-${Date.now()}-${++msgCounter}`;
    const avatar = role === 'user' ? currentUser[0].toUpperCase() : '✦';
    msgs.innerHTML += `
      <div class="message ${role}" id="${id}">
        <div class="message-avatar">${avatar}</div>
        <div class="message-bubble">${content}</div>
      </div>`;
    msgs.scrollTop = msgs.scrollHeight;
    return id;
  }

  function updateMessage(id, content) {
    const el = document.getElementById(id);
    if (el) el.querySelector('.message-bubble').textContent = content;
    document.getElementById('messages').scrollTop = document.getElementById('messages').scrollHeight;
  }

  async function sendMessage() {
    if (isStreaming) return;
    const input = document.getElementById('chat-input');
    const message = input.value.trim();
    if (!message) return;

    input.value = '';
    input.style.height = 'auto';
    isStreaming = true;
    document.getElementById('send-btn').disabled = true;

    addMessage('user', message);
    const assistantId = addMessage('assistant', '...');
    document.getElementById(assistantId).classList.add('typing-indicator');

    chatHistory.push({ role: 'user', content: message });

    let fullResponse = '';

    try {
      const res = await fetch('/api/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username: currentUser, message, history: chatHistory.slice(-10), stream: true }),
      });

      const reader = res.body.getReader();
      const decoder = new TextDecoder();
      document.getElementById(assistantId).classList.remove('typing-indicator');

      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        const text = decoder.decode(value);
        const lines = text.split('\n');
        for (const line of lines) {
          if (line.startsWith('data: ')) {
            const token = line.slice(6);
            if (token === '[DONE]') break;
            fullResponse += token;
            updateMessage(assistantId, fullResponse);
          }
        }
      }

      chatHistory.push({ role: 'assistant', content: fullResponse });
    } catch (e) {
      updateMessage(assistantId, `Error: ${e.message}. Is the tutor service running?`);
    }

    isStreaming = false;
    document.getElementById('send-btn').disabled = false;
    loadStats();
  }

  // ---- Stats ----
  async function loadStats() {
    try {
      const res = await fetch(`/api/stats/${currentUser}`);
      const data = await res.json();
      const today = new Date().toISOString().split('T')[0];
      const minutes = Math.round(data.daily_totals_minutes?.[today] || 0);
      document.getElementById('study-stats').textContent = `Today: ${minutes} min`;
    } catch (e) {}
  }
</script>
</body>
</html>
