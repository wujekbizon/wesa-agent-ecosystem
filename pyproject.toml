To establish the linting and formatting foundation for the WESA agent ecosystem, I am configuring `ruff` via `pyproject.toml` and setting up the corresponding pre-commit hooks. This ensures consistent code quality across all daemon and web monitoring scripts before they enter the CI pipeline.

### Configuration Approach
1.  **Project Metadata**: Defined in `[project]` to enforce Python 3.12 and set the correct versioning.
2.  **Ruff Core**: Configured for Python 3.12 target with a 100-character line limit. The rule set covers standard errors (`E`), syntax issues (`F`), import sorting (`I`), warnings (`W`), and modernization (`UP`). We ignore `E501` specifically because the line length is enforced by the formatter, not the checker.
3.  **Formatting**: Enforced to use double quotes and space indentation for a clean, professional look.
4.  **Pre-commit Hooks**: Configured to run `ruff check --fix` (auto-fixing safe errors) and `ruff format` on every commit, ensuring the codebase remains compliant at the source.

---

[project]
name = "wesa-agent-ecosystem"
version = "0.5.0"
requires-python = ">=3.12"

[tool.ruff]
target-version = "py312"
line-length = 100
select = ["E", "F", "I", "W", "UP"]
ignore = ["E501"]
exclude = ["__pycache__", ".venv", "venv"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

---FILE: .pre-commit-config.yaml---
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.4.0
    hooks:
      - id: ruff
        args: ["--fix"]
      - id: ruff-format