[project]
name = "wesa-agent-ecosystem"
version = "0.5.1"
description = "WESA agent ecosystem - daemon, dashboard, pipelines, and secure core."
requires-python = ">=3.10"
dependencies = [
    "python-dotenv>=1.0.0",
    "requests>=2.31.0",
    "httpx>=0.27.0",
    "rich>=13.0.0",
    "pyyaml>=6.0.0",
    "pypdf>=4.0.0",
    # pdf_chunker.py's text extraction (not PDF splitting) uses this, not
    # pypdf — pypdf's extract_text() mishandles Type3 fonts (common in these
    # source PDFs for title pages, or in some books the entire body text)
    # and silently emits mostly '�' replacement chars instead of erroring.
    "pymupdf>=1.24.0",
    "cryptography>=42.0.0",
    "pydantic-settings>=2.4.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
    "mcp>=1.0.0",
    "psycopg[binary]>=3.1",  # memory system (Neon Postgres), sync driver
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.4.0",
    "pre-commit>=3.7.0",
    # Userspace Postgres for the memory tests. Linux/macOS only (no Windows
    # wheel — it bundles Postgres binaries). On Windows, verify the memory
    # system with the live smoke scripts against Neon instead of pgserver.
    "pgserver>=0.1.4; platform_system != 'Windows'",
]
# google-genai kept as an optional extra rather than a core dependency —
# historical from E0.3 (dead-Gemini audit, 2026-06-13) when the free API key
# had expired. Still true today for a different reason: 2026-07-21 migrated
# this fleet from the API-key-gated Developer API to Vertex AI (ADC, no trial
# clock), which is live and actively used (R1/W1/UX1/FE1/PM1/Q1/SU1/T1/A1/EX1
# all route through it) — but requirements.txt still installs it directly
# regardless of this extra, so `pip install -r requirements.txt` (the
# documented Quick Start path in README.md) always has it. Promote to a core
# `dependencies` entry when the E1 provider-abstraction rewrite lands and
# picks one install path. google-auth added alongside for src/vertex_client.py
# (service-account credential parsing).
gemini-legacy = [
    "google-genai>=1.0.0",
    "google-auth>=2.0.0",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
# Existing layout is a flat `src/` package (not src/wesa_agents/ yet --
# that restructure is E1 scope per the v2 roadmap). Package it as-is so
# `pip install -e .` works without sys.path hacks in the meantime.
packages = ["src", "secure_core"]

[tool.ruff]
target-version = "py310"
line-length = 100
exclude = ["__pycache__", ".venv", "venv", "tests", "node_modules"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests_unit"]
pythonpath = ["."]
