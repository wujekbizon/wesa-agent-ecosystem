name: design-loop
description: "Automated design improvement loop. R1 research (once, 3 ranked directions) → UX1 picks most original direction and prototypes → Q1 review → SU1 skill update → loops back to UX1 until Q1 scores 72/80 (9/10 avg) or max iterations reached."
trigger: manual
stages:
  - id: research
    agent: r1
    task_type: research
    prompt_template: |
      Research the most innovative and distinctive UI/UX design directions for: {topic}

      Survey the full spectrum of human design work with no restrictions on domain — digital products,
      game interfaces, financial terminals, scientific visualization, industrial systems, broadcast
      production, data art, physical product UI, emerging studios, or anything producing genuinely
      excellent and original results in 2026. Look for what is surfacing NOW, not what was mainstream
      in 2022-2024.

      HARD BLACKLIST — do not propose any of the following directions. They are exhausted clichés:
      - Cyberpunk / HUD dashboard / telemetry panel aesthetics
      - Web3 / crypto / glassmorphism dark mode
      - Bento grid / neo-brutalism
      - Flat minimalism with a single accent color
      - Any variation of "computational fluid dynamics" or "data visualization terminal"
      If your research leads you toward any of these, discard and keep searching.

      Output exactly 3 distinct directions, ranked by ORIGINALITY (most original first).
      Each direction must come from a genuinely different domain of inspiration.

      For each direction output:
      DIRECTION [1|2|3] — [sharp specific name]
      Originality score: [X/10] — [one sentence on why this feels fresh in 2026]
      1. Inspiration source — domain and specific examples
      2. Why this direction fits the product
      3. Color palette — hex values, one semantic role per color
      4. Typography stack — specific Google Fonts, justification for each
      5. Layout principle — dominant structural approach and information density
      6. Two concrete UI patterns borrowed directly from the inspiration source
    output_file: null

  - id: design
    agent: ux1
    task_type: design
    prompt_template: |
      Design task: {topic} — Iteration {iteration}

      R1 RESEARCH — THREE RANKED DIRECTIONS:
      {stage.research}

      Q1 FEEDBACK FROM PREVIOUS ITERATION:
      {stage.review}

      ACCUMULATED DESIGN TIPS FROM THIS RUN (built up by SU1 after each Q1 review):
      {read_file:WesaTeam/agent-ecosystem/agents/skills/overlays/{run_id}_ux_overlay.md}

      INSTRUCTIONS:
      - Iteration 1 (no Q1 feedback above): R1 has provided 3 ranked directions above. Select DIRECTION 1 (highest originality score). Commit to it fully — use its exact color palette, typography stack, layout principle, and UI patterns. Do not blend directions or substitute. Produce a fresh, fully realized prototype.
      - Iteration 2+ (Q1 feedback present): DO NOT restart or change design direction. Keep the creative direction, visual identity, color palette, and overall concept intact. Address only Q1's specific failures listed under "What Failed". Raise the floor — do not move the ceiling.
      - Apply all accumulated tips above — they represent everything Q1 has flagged across prior iterations of this run.
      - Output: complete single-file HTML only. No explanation text before or after.
    output_file: "WesaTeam/agent-ecosystem/static/designs/{run_id}_v{iteration}_prototype.html"

  - id: review
    agent: q1
    task_type: review
    prompt_template: |
      You are Q1 — an independent design critic, not part of the team that built this.
      Your job is to assess quality with the same rigour a senior creative director would bring to a portfolio review.
      You have no stake in this work. You call it as you see it.

      Score this HTML prototype for: {topic}

      Score on 8 dimensions, each 0-10:
      Visual Hierarchy, Color & Contrast, Typography, Layout & Spacing,
      Component Consistency, Craft & Finish, Originality, Emotional Register

      For each dimension: score + 2-sentence justification.
      Then: a "What Worked" section (top 3 genuine strengths) and a "What Failed" section (top 3 failures, specific).
      End with: TOTAL SCORE: X/80 and TOP 3 IMPROVEMENTS (specific and actionable).
      Also include: SKILL UPDATE RECOMMENDATIONS — 1-3 universal rules SU1 should add to UX1's skill file.

      Prototype HTML:
      {prev_output}
    output_file: "WesaTeam/agent-ecosystem/logs/designs/{run_id}_v{iteration}_review.md"

  - id: skill_update
    agent: su1
    task_type: skill_update
    prompt_template: |
      Q1 reviewed iteration {iteration} of run {run_id}.
      Your job: update the run-scoped overlay file — DO NOT touch ux_agent.yaml.

      The overlay is a cumulative list of universal design tips UX1 reads on every iteration of this run.
      Extract universal design principles from Q1's SKILL UPDATE RECOMMENDATIONS.
      Merge with any existing overlay tips below — do not duplicate, do not add product-specific rules.
      Keep it tight: max 10 tips total, most impactful only.

      Previous overlay (empty on iteration 1 means start fresh):
      {read_file:WesaTeam/agent-ecosystem/agents/skills/overlays/{run_id}_ux_overlay.md}

      Q1 Review:
      {stage.review}

      Output: ONLY the updated overlay as a markdown list. No YAML. No explanations. Just the tips.
    output_file: "WesaTeam/agent-ecosystem/agents/skills/overlays/{run_id}_ux_overlay.md"
    loop_to: design
    stop_if: "score >= 72"

  - id: skill_merge
    agent: su1
    task_type: skill_merge
    prompt_template: |
      A design for "{topic}" was approved after {iteration} iterations (score >= 72/80).
      Your job: permanently merge the run's accumulated tips into ux_agent.yaml.

      Rules:
      - Only merge rules that are universal — apply to any UI design, not just this product
      - Merge with existing content — do not bloat, do not duplicate
      - If a new tip overlaps an existing rule, sharpen the existing one instead of adding
      - Do NOT change name, role, model, or task_types fields
      - Output the COMPLETE updated ux_agent.yaml — valid YAML starting with: name: UX1

      Current ux_agent.yaml:
      {read_file:WesaTeam/agent-ecosystem/agents/skills/ux_agent.yaml}

      Accumulated run tips (all {iteration} iterations of this run):
      {read_file:WesaTeam/agent-ecosystem/agents/skills/overlays/{run_id}_ux_overlay.md}

      Winning Q1 review (the review that crossed 72/80):
      {stage.review}
    output_file: "WesaTeam/agent-ecosystem/agents/skills/ux_agent.yaml"

max_iterations: 8
notify_on_complete: true
