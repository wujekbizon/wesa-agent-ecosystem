name: design-loop
description: "Automated design improvement loop. R1 research (3 ranked directions) → UX1 picks best direction and prototypes → Q1 reviews → SU1 updates overlay → loops back to UX1 until Q1 scores 72/80 or max iterations reached."
trigger: manual

stages:
  - id: research
    agent: r1
    task_type: research
    prompt_template: |
      Research the most innovative and distinctive UI/UX design directions for: {topic}

      Survey the full spectrum of human design work with no restrictions on domain — digital products,
      game interfaces, financial terminals, scientific visualization, industrial systems, broadcast
      production, data art, physical product UI, emerging studios, or anything producing genuinely
      excellent and original results in 2026. Look for what is surfacing NOW, not what was mainstream
      in 2022-2024.

      HARD BLACKLIST — do not propose any of the following directions. They are exhausted clichés:
      - Cyberpunk / HUD dashboard / telemetry panel aesthetics
      - Web3 / crypto / glassmorphism dark mode
      - Bento grid / neo-brutalism
      - Flat minimalism with a single accent color
      - Any variation of "computational fluid dynamics" or "data visualization terminal"
      If your research leads you toward any of these, discard and keep searching.

      Output exactly 3 distinct directions, ranked by ORIGINALITY (most original first).
      Each direction must come from a genuinely different domain of inspiration.

      For each direction output:
      DIRECTION [1|2|3] — [sharp specific name]
      Originality score: [X/10] — [one sentence on why this feels fresh in 2026]
      1. Inspiration source — domain and specific examples
      2. Why this direction fits the product
      3. Color palette — hex values, one semantic role per color
      4. Typography stack — specific Google Fonts, justification for each
      5. Layout principle — dominant structural approach and information density
      6. Two concrete UI patterns borrowed directly from the inspiration source
    output_file: null

  - id: design
    agent: ux1
    task_type: design
    prompt_template: |
      Design task: {topic} — Iteration {iteration}

      R1 RESEARCH — THREE RANKED DIRECTIONS:
      {stage.research}

      Q1 FEEDBACK FROM PREVIOUS ITERATION:
      {stage.review}

      ACCUMULATED DESIGN TIPS FROM THIS RUN:
      {read_file:WesaTeam/agent-ecosystem/agents/skills/overlays/{run_id}_ux_overlay.md}

      INSTRUCTIONS:

      If this is iteration 1 (Q1 feedback above is empty):
      - Read all 3 directions R1 provided. Choose the one you judge most original and most
        fitting for this product. You are not required to pick Direction 1 — make the best
        creative choice and state your reasoning in the design rationale comment block.
      - Commit to it fully: use its exact color palette, typography stack, layout principle,
        and UI patterns. Do not blend directions or substitute defaults.
      - Produce a fully realized prototype. Apply all accumulated overlay tips above.

      If this is iteration 2+ (Q1 feedback is present):
      - First check Q1's scores for Originality and Emotional Register in the feedback above.
      - If BOTH scored 6 or above: keep the creative direction fully intact. Address only
        the specific failures listed under "What Failed". Raise the floor, do not move the ceiling.
      - If EITHER scored below 6 AND Q1 explicitly states the direction is a concept-level
        failure: switch to the next unused R1 direction (Direction 1 used → try Direction 2,
        Direction 2 used → try Direction 3). State the switch and reason in the design
        rationale comment block. Start fresh with the new direction's palette, typography,
        and layout — do not carry over the old aesthetic.
      - If EITHER scored below 6 but Q1 says it is salvageable: attempt one more iteration
        addressing Q1's specific failures before considering a direction switch.

      Always apply all accumulated overlay tips — they represent everything Q1 has flagged
      across prior iterations of this run.

      Output: complete single-file HTML only. No explanation text before or after.
    output_file: "WesaTeam/agent-ecosystem/static/designs/{run_id}_v{iteration}_prototype.html"

  - id: review
    agent: q1
    task_type: review
    prompt_template: |
      You are Q1 — an independent design critic, not part of the team that built this.
      Your job is to assess quality with the same rigour a senior creative director would
      bring to a portfolio review. You have no stake in this work. You call it as you see it.

      Score this HTML prototype for: {topic}

      Score on 8 dimensions, each 0-10:
      Visual Hierarchy, Color & Contrast, Typography, Layout & Spacing,
      Component Consistency, Craft & Finish, Originality, Emotional Register

      For each dimension: score + 2-sentence justification.
      Then: a "What Worked" section (top 3 genuine strengths) and a "What Failed" section
      (top 3 failures, specific and referencing actual elements by class name or visible text).
      End with: TOTAL SCORE: X/80 and TOP 3 IMPROVEMENTS (specific and actionable).

      For TOP 3 IMPROVEMENTS: if Originality or Emotional Register scored below 6, explicitly
      state whether you believe the direction is salvageable through execution fixes alone,
      or whether it is a concept-level failure that warrants trying a different direction.

      Also include: SKILL UPDATE RECOMMENDATIONS — 2-5 universal rules formatted as:
      RULE: [imperative statement]
      REASON: [one sentence why]

      Prototype HTML:
      {prev_output}
    output_file: "WesaTeam/agent-ecosystem/logs/designs/{run_id}_v{iteration}_review.md"

  - id: skill_update
    agent: su1
    task_type: skill_update
    prompt_template: |
      Q1 reviewed iteration {iteration} of run {run_id}.
      Your job: update the run-scoped overlay file — DO NOT touch ux_agent.yaml.

      The overlay is a cumulative list of universal design tips UX1 reads on every iteration
      of this run. Extract universal design principles from Q1's SKILL UPDATE RECOMMENDATIONS.
      Merge with any existing overlay tips — do not duplicate, do not add product-specific rules.

      When the overlay exceeds 10 tips, remove the least impactful ones to stay at 10.
      Least impactful means: most narrow in scope, most product-specific, or already implied
      by a stronger existing tip.

      Previous overlay:
      {read_file:WesaTeam/agent-ecosystem/agents/skills/overlays/{run_id}_ux_overlay.md}

      Q1 Review:
      {stage.review}

      Output: ONLY the updated overlay as a markdown list. No YAML. No explanations. Just the tips.
    output_file: "WesaTeam/agent-ecosystem/agents/skills/overlays/{run_id}_ux_overlay.md"
    loop_to: design
    stop_if: "score >= 72"

  - id: skill_merge
    agent: su1
    task_type: skill_merge
    prompt_template: |
      A design for "{topic}" completed after {iteration} iterations.

      IMPORTANT: Only proceed with the merge if the Q1 review below contains a total score
      of 72/80 or higher. If the score is below 72, output the following exactly and nothing else:
      MERGE_SKIPPED — score below approval threshold.

      If the score is 72 or above, permanently merge the run's accumulated tips into ux_agent.yaml.

      Merge rules:
      - Only merge rules that are universal — apply to any UI design, not just this product
      - Merge with existing content — do not bloat, do not duplicate
      - If a new tip overlaps an existing rule, sharpen the existing one instead of adding
      - Do NOT change name, role, model, or task_types fields
      - Output the COMPLETE updated ux_agent.yaml — valid YAML starting with: name: UX1

      Current ux_agent.yaml:
      {read_file:WesaTeam/agent-ecosystem/agents/skills/ux_agent.yaml}

      Accumulated run tips:
      {read_file:WesaTeam/agent-ecosystem/agents/skills/overlays/{run_id}_ux_overlay.md}

      Winning Q1 review:
      {stage.review}
    output_file: "WesaTeam/agent-ecosystem/agents/skills/ux_agent.yaml"

max_iterations: 12
notify_on_complete: true