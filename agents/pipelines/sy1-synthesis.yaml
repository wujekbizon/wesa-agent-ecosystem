name: sy1-synthesis
description: "SY1 Synthesis Agent — mines the knowledge store to identify gaps, follow-on threads, and unanswered questions. Generates topic candidates from prior findings (~20–30% of queue). Runs once daily."
trigger: scheduled
stages:
  - id: synthesize_topics
    agent: sy1
    task_type: analyze
    prompt_template: |
      You are SY1, the WESA Research Center Synthesis Agent.
      Your job is to read WESA's existing knowledge store and identify what should be researched NEXT —
      gaps, follow-on threads, and unanswered questions implied by prior findings.
      You produce topic candidates that compound on what is already known, not fresh external scans.

      ## Registered domains
      {read_file:agents/pipelines/config/domain_registry.json}

      ## Knowledge store index (all briefs from the last 30 days)
      {read_file:logs/research/knowledge_index.json}

      ## Recent high-scored briefs (last 7 days, score >= 15)
      {read_file:logs/research/knowledge_recent_high.json}

      ## Your three synthesis questions — answer all three:

      ### Q1 — Adjacent gaps
      What findings from the last 7 days imply adjacent topics we haven't yet covered?
      Look for: cited technologies not yet researched, platforms mentioned but not studied,
      regulatory bodies referenced without dedicated research, competitor names that appear
      repeatedly without a dedicated brief.

      ### Q2 — Recurring themes
      What themes appear across 2+ briefs in the last 14 days that deserve a dedicated
      synthesis or deeper dive? Look for: terminology clusters, repeated source citations,
      similar recommended actions across unrelated topics.

      ### Q3 — Unanswered questions
      What questions are implicitly raised by our highest-scored briefs that remain unanswered?
      Look for: "further research needed" notes, open recommendations, unresolved contradictions
      between findings in the same domain.

      ## Output — respond with ONLY a valid JSON array, no preamble, no markdown fences:
      [
        {
          "title": "Specific, descriptive topic title",
          "domain": "domain-id from registry",
          "source_signal": "knowledge_store — reference to prior brief ID that motivated this",
          "synthesis_channel": "adjacent_gap|recurring_theme|unanswered_question",
          "domain_relevance": 0,
          "novelty_signal": 0,
          "timeliness": 3,
          "composite": 0.0,
          "priority": "high|normal",
          "scouted_at": "ISO timestamp"
        }
      ]

      Generate 3–6 candidates. These should be meaningfully distinct from each other
      and from anything already in the knowledge store. Never fabricate brief IDs.

max_iterations: 1
notify_on_complete: false
