name: research-center
description: "Research Center pipeline. R1 researches a topic from rc_queue.json, W1 synthesizes a brief, RT1 routes the output (ESCALATE → staging / AUTO-SAVE → knowledge store / DISCARD). Topics are dynamically generated by SC1/SY1 — the static topics list below is the seed/fallback only."
trigger: scheduled
stages:
  - id: research
    agent: r1
    task_type: research
    prompt_template: |
      Research this topic thoroughly using live web search. Be specific and current.
      Topic: {topic}

      Output a structured research document with EXACTLY these sections:

      ## Executive Summary
      [3–5 sentences: what is the key finding?]

      ## Key Findings
      [5–8 bullet points: specific, factual, each with a source URL]

      ## Implications for WESA
      [3–5 sentences: how does this affect our agent ecosystem, AgentHire portal, or Wolfmed platform?]

      ## Recommended Actions
      [2–3 concrete next steps WESA should consider]

      ## Sources
      [List each URL with title and access date. Minimum 3 distinct sources required.]
      [If fewer than 3 credible sources found, add this line: LOW_CONFIDENCE: true]
    output_file: null

  - id: synthesize
    agent: w1
    task_type: write
    prompt_template: |
      Convert this raw research into a structured WESA task brief.

      Raw research:
      {prev_output}

      Topic being researched: {topic}

      Output using EXACTLY these headings (no extras, no reordering):

      ## Goal
      [1 sentence: what should WESA do based on this research?]

      ## Context
      [3–5 sentences: why this matters, what was found]

      ## Suggested Task
      [Concrete, specific task description — actionable as written without further clarification]

      ## Suggested Agent
      [Exactly one of: D1 / W1 / R1 / Q1 / UX1 / FE1 / T1 / A1]

      ## Priority
      [high / medium / low — one sentence justification]

      ## Novelty Assessment
      [1 sentence: what is GENUINELY NEW here vs. what WESA already knows? Be specific, not vague.]

      ## Sources
      [Top 3 most relevant URLs from the research, with titles]
    output_file: null
    stage_action: rt1_route

max_iterations: 1
notify_on_complete: false

# --- Seed topics (fallback only) ---
# These are used when rc_queue.json is empty or SC1/SY1 have not yet run.
# Once the dynamic queue is active, these rotate as normal low-priority fillers.
topics:
  - "WESA agent ecosystem improvement — daemon reliability, task routing, agent quality patterns"
  - "AgentHire portal — SaaS agent marketplace design patterns and 2026 competitor landscape"
  - "AI agent frameworks 2026 — LangChain, CrewAI, AutoGen, MCP spec updates and adoption"
  - "UI/UX dashboard design trends 2026 — SaaS monitoring tools, dark themes, real-time data patterns"
  - "Developer tools and AI productivity 2026 — code review automation, testing frameworks, CI/CD patterns"
