<!DOCTYPE html>
<html>
<head>
    <!--
    DESIGN RATIONALE:

    1.  Three Most Important Design Decisions:
        a.  Near-black background with stark white/neon text: This creates a high-contrast, urgent, and focused environment, minimizing eye strain during long monitoring sessions and making critical information immediately pop. It directly aligns with the "Tactical Clarity" concept and mission control aesthetics, where quick visual parsing is paramount. The dark theme reduces glare and eye fatigue, while bright accents draw attention to actionable states.
        b.  Strong Grid and Distinct Zones: Information is spatially separated into clear, self-contained modules (Daemon Health, Task Queue, Task Log). This engineered layout prevents clutter, enhances scannability, and visually reinforces the idea of precise, compartmentalized system monitoring. Each zone serves a specific purpose, allowing the user to quickly locate the type of information they need without cognitive overhead. Purposeful use of padding and borders further defines these zones, preventing elements from feeling 'floating' or accidental.
        c.  Semantic Use of Color and Typography: Neon green (#39FF14) is used for active/success states, a vivid red (#FF3333) for critical alerts/failures, and a warning yellow (#FFFF33) for potential issues. Cyan (#00BFFF) indicates informational or pending states. Typography employs Montserrat for its geometric strength in headings and labels, conveying decisiveness and a modern edge. Space Mono is used for log output and technical details, its fixed-width nature ensuring precise alignment and readability for code-like information, essential for debugging. Every color and font choice serves a functional, not merely decorative, role, guiding the user's attention efficiently and establishing a clear visual hierarchy.

    2.  Why Font Choices Serve This Concept:
        *   Montserrat (sans-serif): Chosen for its strong, geometric, and modern aesthetic. Its clean lines and varied weights (especially bold and semi-bold) allow for clear visual hierarchy in titles, labels, and primary information, directly supporting the "decisive" and "focused" aspects of Tactical Clarity. It's highly readable, even at smaller sizes, which is crucial for dense monitoring interfaces where information needs to be consumed quickly. The sharp angles and balanced proportions resonate with an engineered, precise feel.
        *   Space Mono (monospace): Selected for its blocky, fixed-width character, ideal for displaying technical data such as task IDs, timestamps, and log output. This font evokes a terminal interface, reinforcing the "mission control" and "engineering" feel. Its uniform character spacing ensures alignment and readability for sequential data, making it easier to parse logs and spot patterns or errors quickly, aligning with the "precision" aspect of tactical monitoring. It provides a clear visual distinction for programmatic output, separating it from standard UI text.

    3.  What Makes This Layout Specific to a Monitoring Dashboard vs a Generic Dashboard:
        *   Real-time Focus and Alert Prominence: The layout is designed to highlight dynamic, real-time data streams and critical alerts. The "Daemon Health" section is a prominent, always-visible module that instantly communicates overall system vitality. Status indicators for tasks and daemon health use high-contrast, semantic colors that are visually dominant when active (e.g., a flashing red for critical failure), forcing immediate user attention. The use of animations for critical states is subtle but highly effective in drawing the eye without being distracting.
        *   Information Density for Operational Context: It skillfully balances information density with scannability. Critical operational data (task status, agent assignment, log output) is tightly integrated into distinct, interconnected zones. The layout enables a rapid "glance-assess-drill down" workflow, where a user can quickly identify an issue in the task queue, select it, and immediately see the corresponding logs without navigating away, essential for a user who needs to react fast under pressure. The task log, in particular, emphasizes immediate access to raw, color-coded diagnostic data.
        *   Action-Oriented Visual Language: The entire visual language—from the stark background to the neon accents and precise typography—is geared towards action and rapid response. The layout isn't just about displaying data; it's about facilitating quick decision-making and problem-solving. It prioritizes the most actionable information, making it impossible to miss critical system states and supporting the user's primary goal of maintaining operational stability. The clear grid, distinct panel borders, and consistent typographic hierarchy ensure that information architecture supports rapid problem identification and resolution.
    -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WESA Agent Ecosystem Monitoring</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Custom Tailwind Config (to use custom fonts and colors) -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Montserrat', 'sans-serif'],
                        mono: ['Space Mono', 'monospace'],
                    },
                    colors: {
                        primaryBg: '#0A0A0A',       // Near-black background
                        secondaryBg: '#1A1A1A',     // Slightly lighter for cards/panels
                        tertiaryBg: '#2A2A2A',      // Even lighter for active/hover states
                        accentGreen: '#39FF14',     // Neon green for success/active
                        accentRed: '#FF3333',       // Vivid red for error/critical
                        accentYellow: '#FFFF33',    // Bright yellow for warning
                        accentBlue: '#00BFFF',      // Cyan for info/pending
                        borderDark: '#333333',      // Darker border/divider
                        textLight: '#E0E0E0',       // Light gray for general text
                        textDim: '#A0A0A0',         // Dim gray for secondary text
                    }
                }
            }
        }
    </script>

    <!-- Custom Styles -->
    <style>
        body {
            font-family: 'Montserrat', sans-serif;
            background-color: var(--primaryBg);
            color: var(--textLight);
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        /* Custom scrollbar for log area */
        .custom-scrollbar::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }

        .custom-scrollbar::-webkit-scrollbar-track {
            background: var(--secondaryBg);
            border-radius: 4px;
        }

        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: var(--borderDark);
            border-radius: 4px;
        }

        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: var(--textDim);
        }

        /* Keyframe for flashing critical elements */
        @keyframes flashRed {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.6; } /* Slightly less aggressive flash */
        }
        .flash-red {
            animation: flashRed 1.2s infinite alternate ease-in-out; /* Slower, smoother animation */
        }

        /* Table specific styles for alternating rows and hover */
        .task-table tbody tr {
            transition: background-color 0.15s ease-in-out, border-left-color 0.15s ease-in-out;
        }
        .task-table tbody tr:nth-child(odd) {
            background-color: var(--secondaryBg);
        }
        .task-table tbody tr:nth-child(even) {
            background-color: var(--primaryBg);
        }
        .task-table tbody tr:hover {
            background-color: var(--tertiaryBg);
            cursor: pointer;
        }
        /* Selected row visual emphasis */
        .task-table tbody tr.selected-row {
            background-color: var(--tertiaryBg);
            border-left: 4px solid var(--accentGreen);
        }
        .task-table tbody tr.selected-row td {
            padding-left: calc(1rem - 4px); /* Adjust padding for border */
        }

        /* Adjust padding for table cells due to border-left on selected rows */
        .task-table th, .task-table td {
            padding-left: 1rem; /* Base padding */
        }
        .task-table tbody tr:not(.selected-row) td {
            padding-left: calc(1rem + 4px); /* Compensate for potential border in selected row */
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <!-- React, ReactDOM, Babel CDNs -->
    <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
    <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // Semantic Status Component
        const StatusIndicator = ({ status, text }) => {
            let colorClass = '';
            let dotColor = '';
            switch (status) {
                case 'online':
                case 'active':
                case 'done':
                case 'success':
                    colorClass = 'text-accentGreen';
                    dotColor = 'bg-accentGreen';
                    break;
                case 'in_progress':
                case 'pending':
                    colorClass = 'text-accentBlue';
                    dotColor = 'bg-accentBlue';
                    break;
                case 'warning':
                    colorClass = 'text-accentYellow';
                    dotColor = 'bg-accentYellow';
                    break;
                case 'failed':
                case 'offline':
                case 'critical':
                    colorClass = 'text-accentRed font-semibold'; // More pronounced for critical
                    dotColor = 'bg-accentRed';
                    break;
                default:
                    colorClass = 'text-textDim';
                    dotColor = 'bg-textDim';
            }
            return (
                <span className={`inline-flex items-center text-sm ${colorClass}`}>
                    <span className={`w-2 h-2 rounded-full mr-2 ${dotColor}`}></span>
                    {text || status.replace(/_/g, ' ')}
                </span>
            );
        };

        // Daemon Health Component
        const DaemonHealth = ({ healthData }) => {
            const isCritical = healthData.status === 'offline';
            const agentWarning = healthData.agentsActive < healthData.agentsTotal / 2 && healthData.agentsActive > 0;
            const statusClass = isCritical ? 'bg-accentRed bg-opacity-[0.08] border border-accentRed' : 'bg-secondaryBg border border-borderDark'; // Slightly less opacity for critical bg

            return (
                <div className={`p-6 rounded-lg ${statusClass} transition-colors duration-200 h-full flex flex-col`}>
                    <h2 className="text-xl font-bold text-textLight mb-5 flex items-center">
                        System Daemon Health
                        {isCritical && <span className="ml-3 text-accentRed text-xs font-mono bg-accentRed bg-opacity-20 px-2 py-0.5 rounded flash-red">CRITICAL</span>}
                        {agentWarning && !isCritical && <span className="ml-3 text-accentYellow text-xs font-mono bg-accentYellow bg-opacity-20 px-2 py-0.5 rounded">WARNING</span>}
                    </h2>
                    <div className="grid grid-cols-2 gap-y-4 gap-x-6 flex-grow">
                        <div>
                            <div className="text-xs text-textDim mb-1">Overall Status</div>
                            <StatusIndicator status={healthData.status} text={healthData.status.toUpperCase()} />
                        </div>
                        <div>
                            <div className="text-xs text-textDim mb-1">Uptime</div>
                            <div className="font-mono text-textLight text-lg leading-tight">{healthData.uptime}</div>
                        </div>
                        <div>
                            <div className="text-xs text-textDim mb-1">CPU Usage</div>
                            <div className="font-mono text-textLight text-lg leading-tight">{healthData.cpuUsage.toFixed(1)}%</div>
                        </div>
                        <div>
                            <div className="text-xs text-textDim mb-1">Memory Usage</div>
                            <div className="font-mono text-textLight text-lg leading-tight">{healthData.memoryUsage.toFixed(1)}GB</div>
                        </div>
                        <div className="col-span-2">
                            <div className="text-xs text-textDim mb-1">Agent Pool</div>
                            <div className="font-mono text-textLight text-lg leading-tight">
                                <span className={isCritical ? 'text-accentRed' : (agentWarning ? 'text-accentYellow' : 'text-accentGreen')}>
                                    {healthData.agentsActive}
                                </span> / {healthData.agentsTotal} Active
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        // Task Queue Component
        const TaskQueue = ({ tasks, onTaskSelect, selectedTaskId }) => {
            const generateDuration = (startTime, endTime) => {
                if (!startTime) return 'N/A';
                const start = new Date(startTime);
                const end = endTime ? new Date(endTime) : new Date();
                const diffMs = end - start;
                const totalSeconds = Math.floor(diffMs / 1000);

                if (totalSeconds < 0) return 'N/A'; // Handle cases where end time is before start time

                const hours = Math.floor(totalSeconds / 3600);
                const minutes = Math.floor((totalSeconds % 3600) / 60);
                const seconds = totalSeconds % 60;

                let durationStr = '';
                if (hours > 0) durationStr += `${hours}h `;
                if (minutes > 0 || hours > 0) durationStr += `${minutes}m `;
                durationStr += `${seconds}s`;
                return durationStr.trim();
            };

            return (
                <div className="bg-secondaryBg p-6 rounded-lg border border-borderDark flex flex-col h-full">
                    <h2 className="text-xl font-bold text-textLight mb-5">Task Queue</h2>
                    <div className="overflow-auto custom-scrollbar flex-grow -mx-6"> {/* Negative margin to extend scrollbar to edges */}
                        <table className="min-w-full text-sm task-table table-auto">
                            <thead>
                                <tr className="text-textDim uppercase text-left font-semibold border-b border-borderDark sticky top-0 bg-secondaryBg z-10"> {/* Sticky header */}
                                    <th className="py-2 px-6 whitespace-nowrap w-[15%]">Task ID</th> {/* Adjusted padding */}
                                    <th className="py-2 px-6 whitespace-nowrap w-[20%]">Agent</th>
                                    <th className="py-2 px-6 whitespace-nowrap w-[15%]">Status</th>
                                    <th className="py-2 px-6 whitespace-nowrap w-[25%]">Start Time</th>
                                    <th className="py-2 px-6 whitespace-nowrap w-[25%]">Duration</th>
                                </tr>
                            </thead>
                            <tbody>
                                {tasks.length === 0 ? (
                                    <tr>
                                        <td colSpan="5" className="py-4 px-6 text-center text-textDim">No tasks in queue.</td>
                                    </tr>
                                ) : (
                                    tasks.map(task => (
                                        <tr
                                            key={task.id}
                                            className={`${task.id === selectedTaskId ? 'selected-row' : ''}`}
                                            onClick={() => onTaskSelect(task)}
                                        >
                                            <td className="py-2 px-6 font-mono text-textLight">{task.id}</td>
                                            <td className="py-2 px-6 text-textLight">{task.agent || 'N/A'}</td>
                                            <td className="py-2 px-6"><StatusIndicator status={task.status} /></td>
                                            <td className="py-2 px-6 font-mono text-textDim">{new Date(task.startTime).toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false })}</td>
                                            <td className="py-2 px-6 font-mono text-textDim">
                                                {generateDuration(task.startTime, task.status === 'done' || task.status === 'failed' ? task.endTime : null)}
                                            </td>
                                        </tr>
                                    ))
                                )}
                            </tbody>
                        </table>
                    </div>
                </div>
            );
        };

        // Task Log Component
        const TaskLog = ({ selectedTask }) => {
            const [activeTab, setActiveTab] = useState('overview'); // 'overview', 'raw', 'errors'
            const logEndRef = useRef(null);

            useEffect(() => {
                // Scroll to bottom only if raw log or errors tab is active and task log exists
                if (logEndRef.current && (activeTab === 'raw' || activeTab === 'errors') && selectedTask && selectedTask.log.length > 0) {
                    logEndRef.current.scrollIntoView({ behavior: 'smooth', block: 'end' });
                }
            }, [selectedTask, activeTab, selectedTask?.log.length]);

            const renderLogContent = () => {
                if (!selectedTask) {
                    return (
                        <div className="flex items-center justify-center h-full text-textDim text-lg font-semibold">
                            Select a task to view details.
                        </div>
                    );
                }

                switch (activeTab) {
                    case 'overview':
                        return (
                            <div className="p-6 space-y-4 custom-scrollbar overflow-y-auto h-full">
                                <dl className="grid grid-cols-2 gap-x-6 gap-y-3 text-sm">
                                    <div>
                                        <dt className="text-textDim mb-1">Status</dt>
                                        <dd className="text-textLight"><StatusIndicator status={selectedTask.status} /></dd>
                                    </div>
                                    <div>
                                        <dt className="text-textDim mb-1">Assigned Agent</dt>
                                        <dd className="font-mono text-textLight">{selectedTask.agent || 'N/A'}</dd>
                                    </div>
                                    <div>
                                        <dt className="text-textDim mb-1">Start Time</dt>
                                        <dd className="font-mono text-textLight">{new Date(selectedTask.startTime).toLocaleString()}</dd>
                                    </div>
                                    {selectedTask.endTime && (
                                        <div>
                                            <dt className="text-textDim mb-1">End Time</dt>
                                            <dd className="font-mono text-textLight">{new Date(selectedTask.endTime).toLocaleString()}</dd>
                                        </div>
                                    )}
                                    {selectedTask.duration && (
                                        <div>
                                            <dt className="text-textDim mb-1">Duration</dt>
                                            <dd className="font-mono text-textLight">{selectedTask.duration}</dd>
                                        </div>
                                    )}
                                </dl>

                                <div className="pt-4 border-t border-borderDark mt-6">
                                    <p className="text-textDim mb-2">Latest Log Snippet:</p>
                                    <pre className="font-mono text-xs text-textLight bg-primaryBg p-3 rounded-md overflow-auto custom-scrollbar max-h-36 whitespace-pre-wrap leading-relaxed">
                                        {selectedTask.log.length > 0 ? selectedTask.log[selectedTask.log.length - 1] : 'No log entries yet.'}
                                    </pre>
                                </div>
                            </div>
                        );
                    case 'raw':
                        return (
                            <pre className="font-mono text-xs text-textLight p-6 whitespace-pre-wrap custom-scrollbar overflow-y-auto h-full leading-relaxed">
                                {selectedTask.log.map((line, index) => {
                                    let lineClass = 'text-textLight';
                                    if (line.includes('[ERROR]')) lineClass = 'text-accentRed';
                                    else if (line.includes('[WARNING]')) lineClass = 'text-accentYellow';
                                    else if (line.includes('[SUCCESS]')) lineClass = 'text-accentGreen';
                                    else if (line.includes('[INFO]')) lineClass = 'text-accentBlue';
                                    return <div key={index} className={lineClass}>{line}</div>;
                                })}
                                <div ref={logEndRef} />
                            </pre>
                        );
                    case 'errors':
                        const errors = selectedTask.log.filter(line => line.includes('[ERROR]'));
                        return (
                            <pre className="font-mono text-xs text-textLight p-6 whitespace-pre-wrap custom-scrollbar overflow-y-auto h-full leading-relaxed">
                                {errors.length > 0 ? (
                                    errors.map((line, index) => <div key={index} className="text-accentRed">{line}</div>)
                                ) : (
                                    <div className="text-textDim">No error entries found for this task.</div>
                                )}
                                <div ref={logEndRef} />
                            </pre>
                        );
                    default:
                        return null;
                }
            };

            const tabClass = (tabName) =>
                `px-5 py-3 text-sm font-semibold cursor-pointer border-b-2 transition-colors duration-200 ` +
                (activeTab === tabName
                    ? 'border-accentGreen text-accentGreen'
                    : 'border-transparent text-textDim hover:text-textLight hover:border-textDim');

            return (
                <div className="bg-secondaryBg rounded-lg border border-borderDark flex flex-col h-full">
                    <div className="flex border-b border-borderDark px-2"> {/* Added horizontal padding */}
                        <h2 className="text-lg font-bold text-textLight py-3 pl-4 flex-grow items-center flex">
                           {selectedTask ? `Task Details: ${selectedTask.id}` : 'Task Log'}
                        </h2>
                        <button className={tabClass('overview')} onClick={() => setActiveTab('overview')}>Overview</button>
                        <button className={tabClass('raw')} onClick={() => setActiveTab('raw')}>Raw Log</button>
                        <button className={tabClass('errors')} onClick={() => setActiveTab('errors')}>Errors</button>
                    </div>
                    <div className="flex-grow overflow-hidden relative">
                        {renderLogContent()}
                    </div>
                </div>
            );
        };

        // Main App Component
        const App = () => {
            const [daemonHealth, setDaemonHealth] = useState({
                status: 'online',
                uptime: '2d 14h 32m',
                cpuUsage: 15.2,
                memoryUsage: 3.2,
                agentsActive: 6,
                agentsTotal: 8,
            });

            const initialTasks = [
                { id: 'WES-001', agent: 'Agent Alpha', status: 'done', startTime: new Date(Date.now() - 3600 * 1000).toISOString(), endTime: new Date(Date.now() - 3500 * 1000).toISOString(), duration: '1m 40s', log: [`[INFO] ${new Date(Date.now() - 3600 * 1000).toLocaleTimeString()} Task WES-001 started.`, `[INFO] ${new Date(Date.now() - 3550 * 1000).toLocaleTimeString()} Processing data chunk 1/5...`, `[INFO] ${new Date(Date.now() - 3520 * 1000).toLocaleTimeString()} Processing data chunk 2/5...`, `[SUCCESS] ${new Date(Date.now() - 3500 * 1000).toLocaleTimeString()} Task WES-001 completed successfully.`] },
                { id: 'WES-002', agent: 'Agent Beta', status: 'in_progress', startTime: new Date(Date.now() - 120 * 1000).toISOString(), endTime: null, duration: null, log: [`[INFO] ${new Date(Date.now() - 120 * 1000).toLocaleTimeString()} Task WES-002 started.`, `[INFO] ${new Date(Date.now() - 90 * 1000).toLocaleTimeString()} Fetching external resource...`, `[WARNING] ${new Date(Date.now() - 50 * 1000).toLocaleTimeString()} External resource response slow (HTTP 504).`, `[INFO] ${new Date(Date.now() - 20 * 1000).toLocaleTimeString()} Data processing in progress...`] },
                { id: 'WES-003', agent: 'Agent Gamma', status: 'pending', startTime: new Date(Date.now() - 30 * 1000).toISOString(), endTime: null, duration: null, log: [`[INFO] ${new Date(Date.now() - 30 * 1000).toLocaleTimeString()} Task WES-003 queued, awaiting agent assignment.`] },
                { id: 'WES-004', agent: 'Agent Delta', status: 'failed', startTime: new Date(Date.now() - 600 * 1000).toISOString(), endTime: new Date(Date.now() - 580 * 1000).toISOString(), duration: '20s', log: [`[INFO] ${new Date(Date.now() - 600 * 1000).toLocaleTimeString()} Task WES-004 started.`, `[ERROR] ${new Date(Date.now() - 595 * 1000).toLocaleTimeString()} Database connection failed: connection refused. Retrying...`, `[ERROR] ${new Date(Date.now() - 590 * 1000).toLocaleTimeString()} Database connection failed after 3 retries. Aborting task.`, `[CRITICAL] ${new Date(Date.now() - 580 * 1000).toLocaleTimeString()} Task WES-004 failed: DB_CONNECTION_ERROR.`] },
                { id: 'WES-005', agent: 'Agent Alpha', status: 'done', startTime: new Date(Date.now() - 7200 * 1000).toISOString(), endTime: new Date(Date.now() - 7100 * 1000).toISOString(), duration: '1m 20s', log: [`[INFO] ${new Date(Date.now() - 7200 * 1000).toLocaleTimeString()} Task WES-005 started.`, `[INFO] ${new Date(Date.now() - 7150 * 1000).toLocaleTimeString()} Data validated successfully.`, `[SUCCESS] ${new Date(Date.now() - 7100 * 1000).toLocaleTimeString()} Task WES-005 finished, results archived.`] },
                { id: 'WES-006', agent: 'Agent Gamma', status: 'in_progress', startTime: new Date(Date.now() - 240 * 1000).toISOString(), endTime: null, duration: null, log: [`[INFO] ${new Date(Date.now() - 240 * 1000).toLocaleTimeString()} Task WES-006 started.`, `[INFO] ${new Date(Date.now() - 200 * 1000).toLocaleTimeString()} Initializing AI model (v2.1)...`, `[INFO] ${new Date(Date.now() - 150 * 1000).toLocaleTimeString()} Model loaded successfully. Starting inference on input stream.`] },
                { id: 'WES-007', agent: 'Agent Beta', status: 'pending', startTime: new Date(Date.now() - 10 * 1000).toISOString(), endTime: null, duration: null, log: [`[INFO] ${new Date(Date.now() - 10 * 1000).toLocaleTimeString()} Task WES-007 queued, waiting for available resources.`] },
                { id: 'WES-008', agent: 'Agent Delta', status: 'done', startTime: new Date(Date.now() - 1800 * 1000).toISOString(), endTime: new Date(Date.now() - 1700 * 1000).toISOString(), duration: '1m 5s', log: [`[INFO] ${new Date(Date.now() - 1800 * 1000).toLocaleTimeString()} Task WES-008 started.`, `[INFO] ${new Date(Date.now() - 1750 * 1000).toLocaleTimeString()} Generating comprehensive report...`, `[SUCCESS] ${new Date(Date.now() - 1700 * 1000).toLocaleTimeString()} Report generated and stored in /reports/WES-008.pdf.`] },
                { id: 'WES-009', agent: 'Agent Alpha', status: 'in_progress', startTime: new Date(Date.now() - 90 * 1000).toISOString(), endTime: null, duration: null, log: [`[INFO] ${new Date(Date.now() - 90 * 1000).toLocaleTimeString()} Task WES-009 started.`, `[INFO] ${new Date(Date.now() - 60 * 1000).toLocaleTimeString()} Analyzing input stream: telemetry-feed-03.`, `[WARNING] ${new Date(Date.now() - 30 * 1000).toLocaleTimeString()} High latency detected in stream source: telemetry-feed-03. Re-buffering.`] },
                { id: 'WES-010', agent: 'Agent Beta', status: 'failed', startTime: new Date(Date.now() - 300 * 1000).toISOString(), endTime: new Date(Date.now() - 290 * 1000).toISOString(), duration: '10s', log: [`[INFO] ${new Date(Date.now() - 300 * 1000).toLocaleTimeString()} Task WES-010 started.`, `[ERROR] ${new Date(Date.now() - 295 * 1000).toLocaleTimeString()} File system write error: permissions denied for /output/temp.`, `[ERROR] ${new Date(Date.now() - 292 * 1000).toLocaleTimeString()} Could not write output to disk. Aborting.`, `[CRITICAL] ${new Date(Date.now() - 290 * 1000).toLocaleTimeString()} Task WES-010 failed: FS_WRITE_ERROR.`] },
            ];
            const [tasks, setTasks] = useState(initialTasks);
            const [selectedTask, setSelectedTask] = useState(initialTasks[1]); // Pre-select an in-progress task

            const generateDuration = (startTime, endTime) => {
                if (!startTime) return 'N/A';
                const start = new Date(startTime);
                const end = endTime ? new Date(endTime) : new Date();
                const diffMs = end - start;
                const totalSeconds = Math.floor(diffMs / 1000);

                if (totalSeconds < 0) return 'N/A';

                const hours = Math.floor(totalSeconds / 3600);
                const minutes = Math.floor((totalSeconds % 3600) / 60);
                const seconds = totalSeconds % 60;

                let durationStr = '';
                if (hours > 0) durationStr += `${hours}h `;
                if (minutes > 0 || hours > 0) durationStr += `${minutes}m `;
                durationStr += `${seconds}s`;
                return durationStr.trim();
            };


            const handleTaskSelect = (task) => {
                setSelectedTask(task);
            };

            const now = new Date();
            const timeString = now.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false }); // 24-hour format
            const dateString = now.toLocaleDateString('en-US', { year: 'numeric', month: 'short', day: 'numeric' });

            // Calculate height for main content dynamically based on header height
            const headerRef = useRef(null);
            const [mainContentHeight, setMainContentHeight] = useState('calc(100vh - 160px)');

            useEffect(() => {
                if (headerRef.current) {
                    const headerHeight = headerRef.current.offsetHeight;
                    // Assuming some bottom padding/margin for main or footer space, adjust 48px if needed
                    setMainContentHeight(`calc(100vh - ${headerHeight + 48}px)`);
                }
            }, [headerRef.current]);


            return (
                <div className="min-h-screen bg-primaryBg text-textLight p-8">
                    {/* Header */}
                    <header ref={headerRef} className="flex justify-between items-center pb-6 border-b border-borderDark mb-8">
                        <div className="flex items-center">
                            <span className="text-4xl font-mono text-accentGreen uppercase tracking-wide mr-3">WESA</span>
                            <h1 className="text-3xl font-bold text-textLight tracking-wide">Agent Ecosystem Monitoring</h1>
                        </div>
                        <div className="text-right text-textDim">
                            <div className="font-mono text-xl text-textLight">{timeString}</div>
                            <div className="font-mono text-sm">{dateString}</div>
                            <div className="text-xs">SYSTEM_ID: localhost:8765</div>
                        </div>
                    </header>

                    {/* Main Grid Layout */}
                    <main className="grid grid-cols-12 gap-8" style={{ height: mainContentHeight }}>
                        {/* Left Column (Daemon Health & Task Queue) */}
                        <div className="col-span-8 flex flex-col space-y-8">
                            <div className="h-1/3 min-h-[180px]"> {/* Approx 1/3 height for Daemon Health */}
                                <DaemonHealth healthData={daemonHealth} />
                            </div>
                            <div className="h-2/3 flex-grow"> {/* Approx 2/3 height for Task Queue */}
                                <TaskQueue tasks={tasks} onTaskSelect={handleTaskSelect} selectedTaskId={selectedTask?.id} />
                            </div>
                        </div>

                        {/* Right Column (Task Log) */}
                        <div className="col-span-4 h-full">
                            <TaskLog selectedTask={selectedTask} />
                        </div>
                    </main>
                </div>
            );
        };

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
