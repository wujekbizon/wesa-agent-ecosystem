<!--
DESIGN RATIONALE:
1. DECISION: MODULAR SPLIT-PANE ARCHITECTURE - Implemented a fixed-height, triple-column layout that prioritizes spatial consistency. The left sidebar (navigation), center panel (task queue), and right panel (log inspector) maintain their positions, preventing the "layout jump" common in generic dashboards.
2. DECISION: MONOSPACE DATA ALIGNMENT - Utilized JetBrains Mono for all task IDs, timestamps, and durations. This ensures tabular lining where numbers align vertically, critical for the "Industrial Precision" aesthetic and rapid scanning of time-series data.
3. DECISION: SEMANTIC COLOR CONSTRAINTS - Colors are strictly functional. #7049F0 is reserved for active interaction states, while #7CCC63 and #E5534B are used exclusively for system status. No decorative gradients or "slop" glassmorphism were used, maintaining high contrast (WCAG AA) against the #080A0A base.

TYPOGRAPHY:
- Primary UI: 'Inter' (400, 500, 600) - Chosen for high legibility at small scales in dense monitoring environments.
- Metrics/Data: 'JetBrains Mono' - Chosen for its clear distinction between ambiguous characters (0/O, 1/l) and its engineered feel.

MONITORING SPECIFICITY:
- Unlike a generic dashboard, this UI features a "Task Log" panel that acts as a secondary layer of density (Progressive Disclosure).
- The "TopBar" emphasizes system-level metrics (Agent heartbeat, throughput) rather than user-level metrics.
-->
