<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WESA Agent Ecosystem Dashboard - Industrial Precision</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Design System Tokens (Custom CSS Variables for Tailwind Compatibility) */
        :root {
            /* Backgrounds */
            --color-background-primary: #1A1A1A; /* Main dark background */
            --color-background-panel: #2C2C2C;   /* Solid panel background */
            --color-background-panel-glass: rgba(44, 44, 44, 0.6); /* For subtle glassmorphism */
            --color-background-panel-hover: #383838; /* For hover states on interactive elements */
            
            /* Text Colors */
            --color-text-primary: #F0F0F0; /* Main white/light text */
            --color-text-secondary: #A0A0A0; /* Muted secondary text */
            /* --color-text-tertiary: #666666; - Replaced by var(--color-text-secondary) for better contrast */

            /* Borders & Dividers */
            --color-border-primary: #444444; /* Standard border color */
            --color-border-hover: #5A5A5A;   /* Border on hover for interactive elements */

            /* Accent Colors (Status & Alerts) */
            --color-accent-success: #34D399; /* Greenish teal for 'done' and 'success' */
            --color-accent-in-progress: #60A5FA; /* Clear blue for 'in_progress' */
            --color-accent-failed: #EF4444; /* Strong red for 'failed' and 'error' */
            --color-accent-pending: #FBBF24; /* Muted yellow for 'pending' and 'warn' */
            --color-accent-info: #93C5FD; /* Light blue for 'info' logs */

            /* Shadows */
            --color-shadow-panel: 0 6px 20px rgba(0, 0, 0, 0.25), 0 2px 5px rgba(0, 0, 0, 0.1);
        }

        /* Base Styles */
        body {
            font-family: 'Inter', sans-serif; /* Fallback to sans-serif */
            background-color: var(--color-background-primary);
            color: var(--color-text-primary);
            margin: 0;
        }

        /* Typography */
        .font-inter { font-family: 'Inter', sans-serif; }
        .font-mono { font-family: 'Roboto Mono', monospace; }

        /* Panel Styling (Glassmorphism & Borders) */
        .panel {
            background-color: var(--color-background-panel-glass); /* Semi-transparent background */
            border: 1px solid var(--color-border-primary);
            border-radius: 0.5rem; /* rounded-lg */
            padding: 1rem; /* p-4 */
            box-shadow: var(--color-shadow-panel); /* Custom shadow */
            backdrop-filter: blur(5px); /* Glassmorphism blur effect */
            -webkit-backdrop-filter: blur(5px);
            transition: background-color 0.2s ease-in-out, border-color 0.2s ease-in-out, box-shadow 0.2s ease-in-out; /* Smooth transitions for hover/focus */
        }

        /* Override for header panel to be solid, not glass */
        .panel.header-panel {
            background-color: var(--color-background-panel);
            backdrop-filter: none;
            -webkit-backdrop-filter: none;
            box-shadow: none; /* Header panel should not have glass shadow */
        }

        /* Status Badges */
        .status-badge {
            display: inline-flex;
            align-items: center;
            padding: 0.25rem 0.65rem; /* Slightly more horizontal padding */
            border-radius: 9999px; /* full */
            font-size: 0.7rem; /* Slightly smaller text for compactness */
            font-weight: 500; /* font-medium */
            letter-spacing: 0.025em; /* Slightly wider letter spacing */
            text-transform: uppercase;
            transition: background-color 0.15s ease-in-out;
        }
        .status-badge.pending { background-color: var(--color-accent-pending); color: var(--color-background-primary); }
        .status-badge.in_progress { background-color: var(--color-accent-in-progress); color: var(--color-background-primary); }
        .status-badge.done { background-color: var(--color-accent-success); color: var(--color-background-primary); }
        .status-badge.failed { background-color: var(--color-accent-failed); color: var(--color-text-primary); } /* Keep white text for failed status for strong visual alert */
        
        /* Google Fonts Import */
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Roboto+Mono:wght@400;500&display=swap');

        /* Custom Scrollbar for Logs Panel */
        .custom-scrollbar::-webkit-scrollbar { width: 8px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #3A3A3A; border-radius: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #666666; border-radius: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #888888; }
    </style>
    <!-- React and Babel CDNs -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        /**
         * Renders a status badge with dynamic styling based on the status prop.
         * Follows Shadcn/Radix UI conventions for compact, informative badges.
         * @param {object} props - Component props.
         * @param {string} props.status - The status string (e.g., 'pending', 'in_progress', 'done', 'failed').
         * @returns {JSX.Element} A styled span element.
         */
        const StatusBadge = ({ status }) => {
            let className = "status-badge ";
            let text = status.replace(/_/g, ' ');

            switch (status) {
                case 'pending': className += 'pending'; break;
                case 'in_progress': className += 'in_progress'; break;
                case 'done': className += 'done'; break;
                case 'failed': className += 'failed'; break;
                default: className += 'bg-gray-600 text-gray-300'; // Fallback
            }
            return <span className={className} aria-label={`Task status: ${text}`}>{text}</span>;
        };

        /**
         * Displays the daemon's health status and latency.
         * @param {object} props - Component props.
         * @param {string} props.status - The overall system status (e.g., 'Online', 'Offline').
         * @param {string} props.latency - Current system latency in ms.
         * @returns {JSX.Element} A div with status indicator and text.
         */
        const DaemonHealthIndicator = ({ status, latency }) => {
            const colorClass = status === 'Online' ? 'bg-[var(--color-accent-success)]' : 'bg-[var(--color-accent-failed)]';
            return (
                <div className="flex items-center text-sm font-medium text-[var(--color-text-secondary)]" aria-live="polite">
                    <span className={`w-2.5 h-2.5 rounded-full ${colorClass} mr-2 animate-pulse`} aria-hidden="true"></span>
                    <span>System Status: <span className="text-[var(--color-text-primary)]">{status}</span></span>
                    {status === 'Online' && <span className="ml-4">Latency: <span className="text-[var(--color-text-primary)]">{latency}ms</span></span>}
                </div>
            );
        };

        /**
         * Renders a card displaying an individual agent's status and current task.
         * @param {object} props - Component props.
         * @param {string} props.agentId - The unique ID of the agent (e.g., 'D1').
         * @param {string} props.name - The full name of the agent.
         * @param {string|null} props.currentTask - The task description if active, null if idle.
         * @param {string} props.status - The agent's activity status (e.g., 'Active', 'Idle').
         * @returns {JSX.Element} A div representing the agent card.
         */
        const AgentCard = ({ agentId, name, currentTask, status }) => {
            const statusColor = status === 'Active' ? 'text-[var(--color-accent-success)]' : 'text-[var(--color-text-secondary)]';
            const statusDot = status === 'Active' ? 'bg-[var(--color-accent-success)]' : 'bg-gray-500';
            return (
                <div className="flex flex-col p-3 border border-[var(--color-border-primary)] rounded-md bg-[var(--color-background-primary)] hover:bg-[var(--color-background-panel-hover)] hover:border-[var(--color-border-hover)] transition-all duration-200 transform hover:-translate-y-0.5" aria-label={`Agent ${agentId} status: ${status}. Current task: ${currentTask || 'Idle'}.`}>
                    <div className="flex items-center justify-between mb-1">
                        <span className="text-lg font-semibold text-[var(--color-text-primary)] font-mono">{agentId}</span>
                        <div className="flex items-center text-xs">
                            <span className={`w-2 h-2 rounded-full ${statusDot} mr-1`} aria-hidden="true"></span>
                            <span className={statusColor}>{status}</span>
                        </div>
                    </div>
                    <span className="text-xs text-[var(--color-text-secondary)] truncate" title={currentTask ? `${name} - ${currentTask}` : `${name} - Idle`}>
                        {currentTask ? `Task: ${currentTask}` : 'Idle'}
                    </span>
                </div>
            );
        };

        /**
         * Main application component for the WESA Agent Ecosystem Dashboard.
         * Manages state for tasks, agents, and logs, and orchestrates layout.
         * @returns {JSX.Element} The complete dashboard UI.
         */
        const App = () => {
            // Placeholder data for demonstration
            const [tasks, setTasks] = useState([
                { id: 'T-00129', agent: 'D1', status: 'in_progress', started: '2024-07-26 10:35:10', duration: '0m 45s', progress: '30%', type: 'Code Gen' },
                { id: 'T-00128', agent: 'W1', status: 'in_progress', started: '2024-07-26 10:33:40', duration: '2m 15s', progress: '65%', type: 'Drafting Report' },
                { id: 'T-00127', agent: 'UX1', status: 'in_progress', started: '2024-07-26 10:32:00', duration: '1m 55s', progress: '80%', type: 'Wireframe Review' },
                { id: 'T-00126', agent: '-', status: 'pending', started: '2024-07-26 10:31:20', duration: '-', progress: '-', type: 'Model Training' },
                { id: 'T-00125', agent: 'R1', status: 'done', started: '2024-07-26 10:30:10', duration: '1m 45s', progress: '100%', type: 'Research Query' },
                { id: 'T-00124', agent: 'FE1', status: 'failed', started: '2024-07-26 10:28:30', duration: '1m 20s', progress: 'Error', type: 'Frontend Build' },
                { id: 'T-00123', agent: 'D1', status: 'done', started: '2024-07-26 10:25:00', duration: '3m 15s', progress: '100%', type: 'Code Review' },
            ]);

            const [agents, setAgents] = useState([
                { id: 'D1', name: 'Code Agent', currentTask: 'T-00129 (Code Gen)', status: 'Active' },
                { id: 'W1', name: 'Writer Agent', currentTask: 'T-00128 (Drafting Report)', status: 'Active' },
                { id: 'R1', name: 'Research Agent', currentTask: null, status: 'Idle' },
                { id: 'UX1', name: 'Design Agent', currentTask: 'T-00127 (Wireframe Review)', status: 'Active' },
                { id: 'FE1', name: 'Frontend Agent', currentTask: null, status: 'Idle' },
            ]);

            const [logs, setLogs] = useState([
                { timestamp: '10:35:55', level: 'INFO', message: 'Agent D1 processing new code block for T-00129. Progress: 30%' },
                { timestamp: '10:35:30', level: 'WARN', message: 'Agent W1 detected data anomaly in source for T-00128. Review pending.' },
                { timestamp: '10:35:10', level: 'INFO', message: 'Agent D1 initiated task T-00129: Code Generation.' },
                { timestamp: '10:34:50', level: 'INFO', message: 'Agent UX1 applied design changes to wireframes for T-00127.' },
                { timestamp: '10:34:00', level: 'INFO', message: 'Task T-00130 added to queue: A/B Test Analysis.' },
                { timestamp: '10:33:40', level: 'INFO', message: 'Agent W1 began drafting report for T-00128.' },
                { timestamp: '10:32:00', level: 'INFO', message: 'Agent UX1 started task T-00127: Wireframe Review.' },
                { timestamp: '10:31:50', level: 'ERROR', message: 'Agent FE1 encountered critical build error for T-00124. Attempting rollback.' },
                { timestamp: '10:31:20', level: 'INFO', message: 'Task T-00126 added to queue: Model Training.' },
                { timestamp: '10:30:10', level: 'SUCCESS', message: 'Agent R1 successfully completed T-00125: Research Query.' },
                { timestamp: '10:29:45', level: 'INFO', message: 'Agent D1 completed task T-00123: Code Review.' },
                { timestamp: '10:28:30', level: 'ERROR', message: 'Agent FE1 failed to start task T-00124: Frontend Build.' },
                { timestamp: '10:27:00', level: 'INFO', message: 'Agent R1 processing data for T-00125.' },
                { timestamp: '10:26:30', level: 'INFO', message: 'Agent D1 performing final checks for T-00123.' },
                { timestamp: '10:25:00', level: 'INFO', message: 'Agent D1 initiated code review for T-00123.' },
                { timestamp: '10:24:00', level: 'WARN', message: 'High memory usage detected on Agent W1. Optimization recommended.' },
                { timestamp: '10:23:00', level: 'INFO', message: 'Agent UX1 idle, awaiting new design tasks.' },
                { timestamp: '10:22:00', level: 'INFO', message: 'Agent FE1 idle.' },
                { timestamp: '10:21:00', level: 'INFO', message: 'Agent R1 started task T-00125.' },
                { timestamp: '10:20:00', level: 'INFO', message: 'Agent W1 completed task T-00122.' },
            ]);

            // Auto-scroll to bottom of log panel on new log entries
            useEffect(() => {
                const logPanel = document.getElementById('log-panel-body');
                if (logPanel) {
                    logPanel.scrollTop = logPanel.scrollHeight;
                }
            }, [logs]);

            return (
                <div className="min-h-screen bg-[var(--color-background-primary)] text-[var(--color-text-primary)] p-4 font-inter text-sm">
                    {/* Dashboard Header */}
                    <header className="h-16 flex items-center justify-between px-6 panel header-panel mb-4" aria-label="Dashboard Header">
                        <DaemonHealthIndicator status="Online" latency="12" />
                        <h1 className="text-xl lg:text-2xl font-bold text-[var(--color-text-primary)]" aria-live="polite">WESA Agent Ecosystem Dashboard</h1>
                        <div className="flex items-center">
                            <svg className="w-6 h-6 mr-2 text-[var(--color-text-secondary)]" fill="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                                <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-6h2v6zm0-8h-2V7h2v2z" />
                            </svg>
                            <span className="text-sm font-medium text-[var(--color-text-secondary)]">WESA Corp.</span>
                        </div>
                    </header>

                    {/* Main Content Grid Area */}
                    <main className="grid grid-cols-1 lg:grid-cols-3 gap-4 auto-rows-min mb-4">
                        {/* Agent Overview Panel */}
                        <section className="panel col-span-1" aria-labelledby="agent-overview-title">
                            <h2 id="agent-overview-title" className="text-lg font-semibold mb-3 text-[var(--color-text-primary)]">Agent Overview</h2>
                            <div className="grid grid-cols-1 md:grid-cols-2 gap-3">
                                {agents.map(agent => (
                                    <AgentCard key={agent.id} {...agent} />
                                ))}
                            </div>
                        </section>

                        {/* Live Task Queue Panel */}
                        <section className="panel col-span-1 lg:col-span-2 overflow-auto" aria-labelledby="task-queue-title">
                            <h2 id="task-queue-title" className="text-lg font-semibold mb-3 text-[var(--color-text-primary)]">Live Task Queue</h2>
                            <div className="overflow-x-auto"> {/* Ensures horizontal scroll on smaller screens for wide tables */}
                                <table className="w-full text-left table-auto border-collapse">
                                    <thead className="sticky top-0 bg-[var(--color-background-panel)] text-[var(--color-text-secondary)] text-xs uppercase border-b border-[var(--color-border-primary)]">
                                        <tr>
                                            <th className="py-2 px-3 w-[12%] min-w-[80px]">Task ID</th>
                                            <th className="py-2 px-3 w-[8%] min-w-[60px]">Agent</th>
                                            <th className="py-2 px-3 w-[12%] min-w-[90px]">Status</th>
                                            <th className="py-2 px-3 w-[20%] min-w-[120px]">Type</th>
                                            <th className="py-2 px-3 w-[20%] min-w-[150px]">Started At</th>
                                            <th className="py-2 px-3 w-[10%] min-w-[70px]">Duration</th>
                                            <th className="py-2 px-3 w-[10%] min-w-[70px] text-right">Progress</th>
                                        </tr>
                                    </thead>
                                    <tbody className="font-mono text-xs">
                                        {tasks.map(task => (
                                            <tr key={task.id} className="border-b border-[var(--color-border-primary)] hover:bg-[var(--color-background-panel-hover)] transition-colors duration-150">
                                                <td className="py-2 px-3 font-semibold text-[var(--color-text-primary)]">{task.id}</td>
                                                <td className="py-2 px-3 text-[var(--color-text-secondary)]">{task.agent}</td>
                                                <td className="py-2 px-3"><StatusBadge status={task.status} /></td>
                                                <td className="py-2 px-3 text-[var(--color-text-secondary)]">{task.type}</td>
                                                <td className="py-2 px-3 text-[var(--color-text-secondary)]">{task.started}</td>
                                                <td className="py-2 px-3 text-[var(--color-text-secondary)]">{task.duration}</td>
                                                <td className="py-2 px-3 text-right text-[var(--color-text-secondary)]">{task.progress}</td>
                                            </tr>
                                        ))}
                                    </tbody>
                                </table>
                            </div>
                        </section>
                    </main>

                    {/* Agent Activity Stream Panel (Log Output) */}
                    <section className="panel min-h-[300px]" aria-labelledby="activity-stream-title">
                        <h2 id="activity-stream-title" className="text-lg font-semibold mb-3 text-[var(--color-text-primary)]">Agent Activity Stream</h2>
                        <div id="log-panel-body" className="font-mono text-xs h-[250px] overflow-y-auto pr-2 custom-scrollbar" role="log" aria-live="polite">
                            {logs.map((log, index) => {
                                let levelColor = 'text-[var(--color-text-secondary)]';
                                switch (log.level) {
                                    case 'INFO': levelColor = 'text-[var(--color-accent-info)]'; break;
                                    case 'WARN': levelColor = 'text-[var(--color-accent-pending)]'; break;
                                    case 'ERROR': levelColor = 'text-[var(--color-accent-failed)]'; break;
                                    case 'SUCCESS': levelColor = 'text-[var(--color-accent-success)]'; break;
                                    default: levelColor = 'text-[var(--color-text-secondary)]';
                                }
                                return (
                                    <p key={index} className="pb-0.5" aria-label={`${log.level} at ${log.timestamp}: ${log.message}`}>
                                        <span className="text-[var(--color-text-secondary)] mr-2">[{log.timestamp}]</span>
                                        <span className={`${levelColor} font-semibold mr-2`}>[{log.level}]</span>
                                        <span className="text-[var(--color-text-primary)]">{log.message}</span>
                                    </p>
                                );
                            })}
                        </div>
                    </section>
                </div>
            );
        };

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
