<!--
DESIGN RATIONALE:
1. INDUSTRIAL PRECISION: I have moved away from generic dashboard aesthetics to a "Command Center" approach. This uses a strict 1px grid system (#2A2A2A) and a deep-black base (#0A0A0A) to ensure that the only vibrant colors are functional status indicators. This reduces cognitive load during 24/7 monitoring.
2. CONTEXTUAL TYPOGRAPHY: I implemented a dual-font system. 'Inter' handles the structural UI for readability, while 'JetBrains Mono' is used for all numerical data, PIDs, and logs. This ensures that columns of numbers align perfectly, allowing for rapid visual scanning of anomalies.
3. LOG-FIRST ARCHITECTURE: Unlike generic dashboards that bury logs in a modal, this layout treats the Live Log Viewer as a primary structural element. The vertical split mimics a developer's IDE, acknowledging that monitoring a Python daemon requires seeing the "why" (logs) immediately next to the "what" (metrics).
-->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WESA Agent Ecosystem Monitor</title>
    <!-- Dependencies -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            black: '#0A0A0A',
                            surface: '#141414',
                            border: '#2A2A2A',
                            accent: '#5E6AD2',
                            success: '#10B981',
                            warning: '#F59E0B',
                            critical: '#EF4444',
                            text: '#EDEDED',
                            muted: '#888888',
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace'],
                    }
                }
            }
        }
    </script>

    <style>
        body {
            background-color: #0A0A0A;
            color: #EDEDED;
            overflow: hidden; /* Desktop app feel */
        }

        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #0A0A0A;
        }
        ::-webkit-scrollbar-thumb {
            background: #2A2A2A;
            border-radius: 3px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #3A3A3A;
        }

        .pulse-emerald {
            box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.4);
            animation: pulse-emerald 2s infinite;
        }
        @keyframes pulse-emerald {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 6px rgba(16, 185, 129, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
        }

        .status-badge {
            font-size: 10px;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            font-weight: 700;
            padding: 2px 6px;
            border-radius: 4px;
        }

        .grid-line-h {
            background-image: linear-gradient(to right, #2A2A2A 1px, transparent 1px);
            background-size: 40px 100%;
        }

        .log-line:hover {
            background-color: rgba(94, 106, 210, 0.05);
        }
        
        .type-scale-1 { font-size: 0.75rem; line-height: 1rem; }
        .type-scale-2 { font-size: 0.875rem; line-height: 1.25rem; }
        .type-scale-3 { font-size: 1rem; line-height: 1.5rem; }
        .type-scale-4 { font-size: 1.25rem; line-height: 1.75rem; }
        .type-scale-5 { font-size: 1.875rem; line-height: 2.25rem; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo, useRef } = React;

        // STATIC ASSETS & MOCK DATA
        const AGENTS = [
            { id: 'wesa-daemon-01', type: 'Orchestrator', status: 'healthy', pid: 4402, cpu: '1.2%', mem: '128MB', uptime: '14d 2h' },
            { id: 'wesa-worker-a', type: 'Inference', status: 'healthy', pid: 4405, cpu: '45.8%', mem: '2.4GB', uptime: '4d 18h' },
            { id: 'wesa-worker-b', type: 'Inference', status: 'warning', pid: 4406, cpu: '88.1%', mem: '4.1GB', uptime: '4d 18h' },
            { id: 'wesa-stream-01', type: 'Socket-Relay', status: 'healthy', pid: 4409, cpu: '0.4%', mem: '64MB', uptime: '22d 5h' },
        ];

        const TASKS = [
            { id: 'TX-9902', type: 'CLASSIFY', model: 'gpt-4o', status: 'COMPLETED', created: '2025-05-12 14:22:01', duration: '842ms', agent: 'worker-a' },
            { id: 'TX-9903', type: 'EXTRACT', model: 'claude-3-sonnet', status: 'PROCESSING', created: '2025-05-12 14:22:04', duration: '2.1s', agent: 'worker-b' },
            { id: 'TX-9904', type: 'EMBED', model: 'text-ada-002', status: 'QUEUED', created: '2025-05-12 14:22:05', duration: '-', agent: '-' },
            { id: 'TX-9905', type: 'SUMMARIZE', model: 'gpt-4o', status: 'FAILED', created: '2025-05-12 14:21:50', duration: '4.5s', agent: 'worker-a' },
            { id: 'TX-9906', type: 'CLASSIFY', model: 'gpt-4o', status: 'COMPLETED', created: '2025-05-12 14:21:48', duration: '711ms', agent: 'worker-a' },
            { id: 'TX-9907', type: 'EXTRACT', model: 'claude-3-sonnet', status: 'COMPLETED', created: '2025-05-12 14:21:40', duration: '1.8s', agent: 'worker-b' },
            { id: 'TX-9908', type: 'EMBED', model: 'text-ada-002', status: 'COMPLETED', created: '2025-05-12 14:21:35', duration: '112ms', agent: 'worker-a' },
            { id: 'TX-9909', type: 'SUMMARIZE', model: 'gpt-4o', status: 'COMPLETED', created: '2025-05-12 14:21:30', duration: '3.2s', agent: 'worker-b' },
        ];

        const MOCK_LOGS = [
            { ts: '14:22:04.112', level: 'INFO', msg: 'Orchestrator received task TX-9903' },
            { ts: '14:22:04.145', level: 'DEBUG', msg: 'Routing TX-9903 to wesa-worker-b (Inference)' },
            { ts: '14:22:04.201', level: 'INFO', msg: 'Worker-b: Loading model claude-3-sonnet context' },
            { ts: '14:22:04.500', level: 'DEBUG', msg: 'Executing prompt chain sequence [0, 1, 2]' },
            { ts: '14:22:05.101', level: 'WARN', msg: 'Memory usage spike detected on worker-b (88.1%)' },
            { ts: '14:22:05.120', level: 'INFO', msg: 'Orchestrator received task TX-9904' },
            { ts: '14:22:05.121', level: 'DEBUG', msg: 'Task TX-9904 added to global queue' },
            { ts: '14:22:05.500', level: 'ERROR', msg: 'TX-9905: ConnectionTimeout at openai_client.py:142' },
            { ts: '14:22:05.501', level: 'DEBUG', msg: 'Traceback (most recent call last):' },
            { ts: '14:22:05.502', level: 'DEBUG', msg: '  File "/app/worker.py", line 88, in run_inference' },
            { ts: '14:22:05.503', level: 'DEBUG', msg: '    result = self.client.complete(payload)' },
            { ts: '14:22:05.504', level: 'ERROR', msg: 'RuntimeError: Failed to reach API upstream' },
        ];

        // COMPONENTS
        const Badge = ({ status }) => {
            const styles = {
                COMPLETED: 'bg-brand-success/10 text-brand-success border border-brand-success/20',
                PROCESSING: 'bg-brand-accent/10 text-brand-accent border border-brand-accent/20 animate-pulse',
                QUEUED: 'bg-brand-muted/10 text-brand-muted border border-brand-muted/20',
                FAILED: 'bg-brand-critical/10 text-brand-critical border border-brand-critical/20',
            };
            return <span className={`status-badge ${styles[status]}`}>{status}</span>;
        };

        const SidebarItem = ({ agent }) => (
            <div className="p-4 border-b border-brand-border hover:bg-brand-surface cursor-pointer transition-colors">
                <div className="flex items-center justify-between mb-2">
                    <div className="flex items-center gap-2">
                        <div className={`w-2 h-2 rounded-full ${agent.status === 'healthy' ? 'bg-brand-success pulse-emerald' : 'bg-brand-warning'}`}></div>
                        <span className="font-mono text-sm font-semibold">{agent.id}</span>
                    </div>
                    <span className="type-scale-1 text-brand-muted font-mono">PID {agent.pid}</span>
                </div>
                <div className="flex justify-between text-brand-muted font-mono type-scale-1">
                    <span>CPU: <span className={parseFloat(agent.cpu) > 80 ? 'text-brand-critical' : 'text-brand-text'}>{agent.cpu}</span></span>
                    <span>MEM: <span className="text-brand-text">{agent.mem}</span></span>
                </div>
            </div>
        );

        const App = () => {
            const [wsStatus, setWsStatus] = useState('disconnected');
            const [selectedTask, setSelectedTask] = useState(TASKS[1]);
            const [commandPaletteOpen, setCommandPaletteOpen] = useState(false);

            // WebSocket Simulation (Requirement: Reconnect logic for ws://localhost:8765/ws)
            useEffect(() => {
                let socket;
                const connect = () => {
                    setWsStatus('connecting');
                    socket = new WebSocket('ws://localhost:8765/ws');
                    
                    socket.onopen = () => setWsStatus('connected');
                    socket.onclose = () => {
                        setWsStatus('disconnected');
                        setTimeout(connect, 5000); // Reconnect logic
                    };
                    socket.onerror = () => {
                        socket.close();
                    };
                };

                // In a real environment we'd call connect(); 
                // For this prototype, we simulate a connecting state then a graceful "down" state
                const timer = setTimeout(() => setWsStatus('disconnected'), 2000);
                
                // Keyboard shortcut listener
                const handleKeyDown = (e) => {
                    if ((e.metaKey || e.ctrlKey) && e.key === 'k') {
                        e.preventDefault();
                        setCommandPaletteOpen(prev => !prev);
                    }
                };
                window.addEventListener('keydown', handleKeyDown);

                return () => {
                    clearTimeout(timer);
                    window.removeEventListener('keydown', handleKeyDown);
                };
            }, []);

            return (
                <div className="flex h-screen flex-col font-sans select-none">
                    
                    {/* TOP BAR */}
                    <header className="h-16 border-b border-brand-border bg-brand-black flex items-center justify-between px-6 z-20">
                        <div className="flex items-center gap-8">
                            <div className="flex items-center gap-2">
                                <div className="w-6 h-6 bg-brand-accent rounded flex items-center justify-center font-bold text-xs">W</div>
                                <span className="font-bold tracking-tight text-lg">WESA <span className="text-brand-muted font-normal ml-1">ECOSYSTEM</span></span>
                            </div>
                            
                            <nav className="flex items-center gap-6">
                                <div className="flex flex-col">
                                    <span className="type-scale-1 text-brand-muted uppercase font-bold tracking-widest">Global Status</span>
                                    <div className="flex items-center gap-2">
                                        <div className="w-2 h-2 bg-brand-success rounded-full"></div>
                                        <span className="font-mono type-scale-2">SYSTEM_OPERATIONAL</span>
                                    </div>
                                </div>
                                <div className="w-px h-8 bg-brand-border"></div>
                                <div className="flex flex-col">
                                    <span className="type-scale-1 text-brand-muted uppercase font-bold tracking-widest">Active Agents</span>
                                    <span className="font-mono type-scale-2">04 / 04</span>
                                </div>
                                <div className="flex flex-col">
                                    <span className="type-scale-1 text-brand-muted uppercase font-bold tracking-widest">Tasks/Hr</span>
                                    <span className="font-mono type-scale-2">1,204</span>
                                </div>
                            </nav>
                        </div>

                        <div className="flex items-center gap-4">
                            <div className={`flex items-center gap-2 px-3 py-1 rounded-full border border-brand-border bg-brand-surface ${wsStatus === 'connected' ? 'text-brand-success' : 'text-brand-muted'}`}>
                                <div className={`w-1.5 h-1.5 rounded-full ${wsStatus === 'connected' ? 'bg-brand-success' : 'bg-brand-muted'}`}></div>
                                <span className="font-mono text-[10px] font-bold">WS: {wsStatus.toUpperCase()}</span>
                            </div>
                            <div className="text-brand-muted hover:text-brand-text cursor-pointer">
                                <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" /><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" /></svg>
                            </div>
                        </div>
                    </header>

                    <div className="flex flex-1 overflow-hidden">
                        {/* LEFT SIDEBAR - AGENTS */}
                        <aside className="w-64 border-r border-brand-border bg-brand-black flex flex-col">
                            <div className="p-4 border-b border-brand-border bg-brand-surface/50">
                                <h2 className="type-scale-1 font-bold tracking-widest text-brand-muted uppercase">Ecosystem Nodes</h2>
                            </div>
                            <div className="flex-1 overflow-y-auto">
                                {AGENTS.map(agent => (
                                    <SidebarItem key={agent.id} agent={agent} />
                                ))}
                            </div>
                            <div className="p-4 border-t border-brand-border text-[10px] text-brand-muted font-mono bg-brand-surface/20">
                                PRESS <kbd className="bg-brand-border px-1 rounded text-brand-text">⌘ K</kbd> TO NAVIGATE
                            </div>
                        </aside>

                        {/* MAIN CONTENT AREA */}
                        <main className="flex-1 flex flex-col bg-brand-black overflow-hidden">
                            
                            {/* TOP HALF: TASK QUEUE TABLE */}
                            <section className="flex-[0.6] flex flex-col border-b border-brand-border min-h-0">
                                <div className="px-6 py-3 border-b border-brand-border flex items-center justify-between bg-brand-surface/30">
                                    <div className="flex items-center gap-4">
                                        <h2 className="type-scale-2 font-bold tracking-tight">TASK QUEUE</h2>
                                        <div className="flex gap-1">
                                            {['ALL', 'ACTIVE', 'FAILED'].map(filter => (
                                                <button key={filter} className={`px-2 py-0.5 rounded text-[10px] font-bold ${filter === 'ALL' ? 'bg-brand-accent text-white' : 'text-brand-muted hover:bg-brand-surface'}`}>{filter}</button>
                                            ))}
                                        </div>
                                    </div>
                                    <span className="type-scale-1 font-mono text-brand-muted italic">Showing 8 active operations</span>
                                </div>
                                
                                <div className="flex-1 overflow-y-auto">
                                    <table className="w-full text-left font-mono type-scale-2 border-collapse">
                                        <thead className="sticky top-0 bg-brand-black text-brand-muted border-b border-brand-border z-10">
                                            <tr>
                                                <th className="px-6 py-3 font-medium type-scale-1 uppercase">Task ID</th>
                                                <th className="px-6 py-3 font-medium type-scale-1 uppercase">Type</th>
                                                <th className="px-6 py-3 font-medium type-scale-1 uppercase">Model</th>
                                                <th className="px-6 py-3 font-medium type-scale-1 uppercase">Status</th>
                                                <th className="px-6 py-3 font-medium type-scale-1 uppercase">Created</th>
                                                <th className="px-6 py-3 font-medium type-scale-1 uppercase">Duration</th>
                                            </tr>
                                        </thead>
                                        <tbody className="divide-y divide-brand-border/50">
                                            {TASKS.map(task => (
                                                <tr 
                                                    key={task.id} 
                                                    onClick={() => setSelectedTask(task)}
                                                    className={`cursor-pointer transition-colors ${selectedTask.id === task.id ? 'bg-brand-accent/10' : 'hover:bg-brand-surface'}`}
                                                >
                                                    <td className="px-6 py-4 font-bold text-brand-text">{task.id}</td>
                                                    <td className="px-6 py-4 text-brand-muted">{task.type}</td>
                                                    <td className="px-6 py-4 text-brand-muted">{task.model}</td>
                                                    <td className="px-6 py-4"><Badge status={task.status} /></td>
                                                    <td className="px-6 py-4 text-brand-muted">{task.created.split(' ')[1]}</td>
                                                    <td className="px-6 py-4 text-brand-text">{task.duration}</td>
                                                </tr>
                                            ))}
                                        </tbody>
                                    </table>
                                </div>
                            </section>

                            {/* BOTTOM HALF: LOGS & DETAIL SPLIT */}
                            <section className="flex-[0.4] flex min-h-0">
                                {/* DETAIL PANEL */}
                                <div className="w-1/3 border-r border-brand-border p-6 flex flex-col gap-4 overflow-y-auto">
                                    <h3 className="type-scale-1 font-bold text-brand-muted uppercase tracking-widest border-b border-brand-border pb-2">Task Inspector</h3>
                                    <div className="space-y-4">
                                        <div>
                                            <div className="text-[10px] text-brand-muted uppercase font-bold">Metadata</div>
                                            <div className="bg-brand-surface p-3 rounded mt-1 border border-brand-border font-mono type-scale-2 space-y-1">
                                                <div className="flex justify-between"><span>AGENT</span><span className="text-brand-accent font-bold">{selectedTask.agent}</span></div>
                                                <div className="flex justify-between"><span>RETRIES</span><span>0</span></div>
                                                <div className="flex justify-between"><span>PRIORITY</span><span>HIGH</span></div>
                                            </div>
                                        </div>
                                        <div>
                                            <div className="text-[10px] text-brand-muted uppercase font-bold">Inference Parameters</div>
                                            <div className="bg-brand-surface p-3 rounded mt-1 border border-brand-border font-mono type-scale-2 text-brand-muted">
                                                {`{ "temp": 0.7, "max_tokens": 1024, "top_p": 1.0 }`}
                                            </div>
                                        </div>
                                        <button className="w-full py-2 bg-brand-border hover:bg-brand-surface rounded font-bold type-scale-2 transition-colors">
                                            REQUEUE TASK
                                        </button>
                                    </div>
                                </div>

                                {/* LOG PANEL */}
                                <div className="flex-1 flex flex-col bg-brand-black">
                                    <div className="px-4 py-2 border-b border-brand-border flex items-center justify-between bg-brand-surface/20">
                                        <span className="type-scale-1 font-bold text-brand-muted font-mono uppercase">Live_Output_Stream // {selectedTask.id}</span>
                                        <div className="flex gap-4">
                                            <label className="flex items-center gap-2 cursor-pointer">
                                                <div className="w-3 h-3 border border-brand-border rounded bg-brand-accent"></div>
                                                <span className="type-scale-1 text-brand-muted">Auto-scroll</span>
                                            </label>
                                        </div>
                                    </div>
                                    <div className="flex-1 p-4 font-mono type-scale-2 overflow-y-auto bg-black/40">
                                        {MOCK_LOGS.map((log, i) => (
                                            <div key={i} className="log-line flex gap-4 py-0.5 leading-relaxed group">
                                                <span className="text-brand-muted shrink-0 w-24">{log.ts}</span>
                                                <span className={`shrink-0 w-12 font-bold ${
                                                    log.level === 'ERROR' ? 'text-brand-critical' : 
                                                    log.level === 'WARN' ? 'text-brand-warning' : 
                                                    log.level === 'INFO' ? 'text-brand-accent' : 'text-brand-muted'
                                                }`}>
                                                    [{log.level}]
                                                </span>
                                                <span className={log.msg.includes('Traceback') || log.msg.startsWith('  ') ? 'text-brand-critical' : 'text-brand-text'}>
                                                    {log.msg}
                                                </span>
                                            </div>
                                        ))}
                                        <div className="flex gap-4 py-0.5 animate-pulse">
                                            <span className="text-brand-muted shrink-0 w-24">14:22:06.001</span>
                                            <span className="text-brand-muted font-bold shrink-0 w-12">[WAIT]</span>
                                            <span className="text-brand-muted italic">Awaiting upstream frames...</span>
                                        </div>
                                    </div>
                                </div>
                            </section>
                        </main>
                    </div>

                    {/* COMMAND PALETTE MODAL */}
                    {commandPaletteOpen && (
                        <div className="fixed inset-0 z-50 flex items-start justify-center pt-32 bg-brand-black/80 backdrop-blur-sm">
                            <div className="w-[600px] bg-brand-surface border border-brand-border rounded-lg shadow-2xl overflow-hidden animate-in fade-in zoom-in duration-200">
                                <div className="p-4 border-b border-brand-border flex items-center gap-3">
                                    <svg className="w-5 h-5 text-brand-muted" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" /></svg>
                                    <input autoFocus className="bg-transparent border-none outline-none flex-1 text-lg font-mono" placeholder="Jump to agent, task, or setting..." />
                                </div>
                                <div className="p-2">
                                    <div className="text-[10px] text-brand-muted px-3 py-2 uppercase font-bold tracking-widest">Suggestions</div>
                                    {['Go to Logs', 'Restart wesa-worker-b', 'Clear Queue', 'Export Metrics'].map(item => (
                                        <div key={item} className="px-4 py-3 hover:bg-brand-accent rounded cursor-pointer group flex items-center justify-between">
                                            <span className="font-mono group-hover:text-white">{item}</span>
                                            <span className="text-[10px] text-brand-muted group-hover:text-white/70">Action</span>
                                        </div>
                                    ))}
                                </div>
                                <div className="p-3 bg-brand-black border-t border-brand-border flex justify-between items-center text-[10px] text-brand-muted">
                                    <span>↑↓ to navigate</span>
                                    <span>ESC to close</span>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
</html><!-- No explanation text -->
