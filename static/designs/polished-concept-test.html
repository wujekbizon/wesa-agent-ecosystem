    <title>WESA Agent Ecosystem Dashboard - Industrial Precision</title>
    <!-- Design Rationale Comment Block -->
    <!--
    1.  Three Most Important Design Decisions:
        a.  **Grid-Based Structural Clarity with Layered Panels**: The layout emphasizes a strong, multi-column grid (`lg:grid-cols-3`) to organize distinct information modules (Agent Overview, Live Task Queue, Activity Stream). Panels use a subtle 'glassmorphism' effect (`backdrop-filter`) over a dark primary background, creating depth and separating content without feeling heavy. The header, however, is a solid panel, providing a firm visual anchor. This layering strategy ensures information density is managed, preventing visual clutter while maintaining a cohesive, engineered look.
        b.  **Typographic Hierarchy with Semantic Font Usage**: `Inter` is used for primary headings and descriptive text, providing modern readability and clear hierarchy through varied weights and sizes. `Roboto Mono` is specifically reserved for technical data, IDs, timestamps, and log entries. This semantic distinction reinforces the "Industrial Precision" concept, making data immediately recognizable and scannable, aligning with the need for tactical clarity in monitoring complex systems.
        c.  **Purposeful Color Application and Micro-interactions**: Every color serves a semantic role (e.g., specific status indicators for success, failure, pending, info, warning) rather than decorative gradients or arbitrary accents. Accent colors are chosen for high contrast against the dark theme, adhering to WCAG 2.2 AA. Micro-interactions like subtle hover effects on cards and table rows, along with a pulsing daemon health indicator, provide immediate feedback, enhancing usability and the sense of a 'live' system without being distracting.

    2.  Why the Font Choices Serve This Concept:
        -   **Inter**: As the primary sans-serif, Inter is a highly legible and versatile typeface designed for screen interfaces. Its clean lines and robust family of weights provide excellent readability for titles, labels, and descriptive text. It conveys a professional, modern, and precise feel, aligning with the "Industrial Precision" and "Tactical Clarity" concepts by ensuring all primary information is communicated clearly and efficiently.
        -   **Roboto Mono**: This monospaced font is crucial for presenting technical data. Its fixed-width characters make aligning codes, IDs, timestamps, and log messages effortless, which is essential for scannability in a monitoring dashboard. The technical, almost "terminal-like" aesthetic of Roboto Mono reinforces the "engineered" and "data-driven" aspect of the system, creating a distinct visual language for critical, parseable information.

    3.  What Makes This Layout Specific to a Monitoring Dashboard vs. a Generic Dashboard:
        -   **Real-time Data Prioritization**: The prominent "Live Task Queue" and "Agent Activity Stream" panels are centrally located and given significant visual weight, emphasizing the dashboard's core purpose of monitoring ongoing operations in real-time. The "Agent Overview" provides quick access to agent status, crucial for understanding resource allocation in an agent ecosystem.
        -   **Hierarchical Information Density**: Rather than sparse, high-level summaries, this dashboard presents a rich array of specific data points (Task IDs, Agent IDs, detailed statuses, timestamps, log levels, progress percentages). The use of distinct typographical styles (Inter for labels, Roboto Mono for data) and strong grid lines helps to categorize and make this dense information scannable, which is vital for system operators needing to quickly diagnose issues or track progress.
        -   **Actionable Visual Cues**: Semantic colors are strategically used for status indicators (green for done/success, blue for in-progress, red for failed, yellow for pending/warn). These aren't just decorative; they are direct visual cues designed for rapid interpretation of system health and task states, enabling quick identification of critical events without deep reading. The "Daemon Health Indicator" in the header provides an immediate system-wide health check. The layout and visual language are tailored for operational decision-making.
    -->

    <script src="https://cdn.tailwindcss.com"></script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        /* Design System Tokens (Custom CSS Variables for Tailwind Compatibility) */
        :root {
            /* Backgrounds */
            --color-background-primary: #121212; /* Darker, slightly deeper main background */
            --color-background-panel-solid: #222222;   /* Solid panel background, slightly lighter than primary */
            --color-background-panel-glass: rgba(34, 34, 34, 0.7); /* For subtle glassmorphism, based on solid panel */
            --color-background-element: #333333; /* For smaller interactive elements, like agent cards */
            --color-background-hover: #404040; /* For hover states on interactive elements */
            
            /* Text Colors */
            --color-text-primary: #E0E0E0; /* Main light text */
            --color-text-secondary: #A0A0A0; /* Muted secondary text */

            /* Borders & Dividers */
            --color-border-primary: #3A3A3A; /* Standard border color */
            --color-border-accent: #6A6A6A;   /* Stronger border for focus/active states */

            /* Accent Colors (Status & Alerts) */
            --color-accent-success: #2ECC71; /* Stronger green for 'done' and 'success' */
            --color-accent-in-progress: #3498DB; /* Clearer blue for 'in_progress' */
            --color-accent-failed: #E74C3C; /* Stronger red for 'failed' and 'error' */
            --color-accent-pending: #F1C40F; /* Brighter yellow for 'pending' and 'warn' */
            --color-accent-info: #A0D0FF; /* Lighter, clearer blue for 'info' logs */

            /* Shadows */
            --color-shadow-panel: 0 8px 24px rgba(0, 0, 0, 0.3), 0 3px 8px rgba(0, 0, 0, 0.15);
        }

        /* Base Styles */
        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--color-background-primary);
            color: var(--color-text-primary);
            margin: 0;
            line-height: 1.5; /* Default line height for readability */
            font-size: 0.875rem; /* Base text size (sm) */
        }

        /* Typography */
        .font-inter { font-family: 'Inter', sans-serif; }
        .font-mono { font-family: 'Roboto Mono', monospace; }

        /* Panel Styling (Glassmorphism & Borders) */
        .panel {
            background-color: var(--color-background-panel-glass); /* Semi-transparent background */
            border: 1px solid var(--color-border-primary);
            border-radius: 0.5rem; /* rounded-lg */
            padding: 1.5rem; /* Increased padding for more breathing room */
            box-shadow: var(--color-shadow-panel); /* Custom shadow */
            backdrop-filter: blur(8px); /* Increased blur for more pronounced glass effect */
            -webkit-backdrop-filter: blur(8px);
            transition: background-color 0.2s ease-in-out, border-color 0.2s ease-in-out, box-shadow 0.2s ease-in-out;
        }

        /* Override for header panel to be solid, not glass */
        .panel.header-panel {
            background-color: var(--color-background-panel-solid); /* Solid background for header */
            backdrop-filter: none;
            -webkit-backdrop-filter: none;
            box-shadow: none; /* Header panel should not have glass shadow */
            border-bottom: 1px solid var(--color-border-accent); /* Stronger bottom border for header */
            border-radius: 0; /* No border-radius for full-width header */
            padding: 1rem 1.5rem; /* Adjusted padding for header */
        }

        /* Status Badges */
        .status-badge {
            display: inline-flex;
            align-items: center;
            padding: 0.2rem 0.6rem; /* Refined padding for compactness */
            border-radius: 9999px; /* full */
            font-size: 0.65rem; /* Slightly smaller text for compactness */
            font-weight: 600; /* font-semibold */
            letter-spacing: 0.05em; /* Slightly wider letter spacing for uppercase text */
            text-transform: uppercase;
            transition: background-color 0.15s ease-in-out, color 0.15s ease-in-out;
            white-space: nowrap; /* Prevent badge text from wrapping */
        }
        .status-badge.pending { background-color: var(--color-accent-pending); color: var(--color-background-primary); }
        .status-badge.in_progress { background-color: var(--color-accent-in-progress); color: var(--color-background-primary); }
        .status-badge.done { background-color: var(--color-accent-success); color: var(--color-background-primary); }
        .status-badge.failed { background-color: var(--color-accent-failed); color: var(--color-text-primary); } /* Keep white text for failed status for strong visual alert */
        
        /* Custom Scrollbar for Logs Panel and Tables */
        .custom-scrollbar::-webkit-scrollbar { width: 8px; height: 8px; } /* Also for horizontal scroll */
        .custom-scrollbar::-webkit-scrollbar-track { background: var(--color-background-panel-solid); border-radius: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: var(--color-border-primary); border-radius: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: var(--color-border-accent); }

        /* Table Specific Styles */
        .table-panel-container {
            max-height: 400px; /* Max height for task queue table to enable internal scroll */
            overflow-y: auto;
            /* No border on this div as the table itself will have it via thead/tbody border-b */
        }

        .table-fixed-header thead {
            position: sticky;
            top: 0;
            z-index: 10;
            background-color: var(--color-background-panel-solid); /* Solid background for sticky header */
            border-bottom: 1px solid var(--color-border-accent); /* Stronger border for header */
        }
        .table-fixed-header th {
            font-weight: 600; /* Semibold for table headers */
            letter-spacing: 0.025em; /* Tailwind's `tracking-wide` */
            color: var(--color-text-secondary);
            padding-top: 0.75rem; /* py-3 */
            padding-bottom: 0.75rem; /* py-3 */
        }

        /* Agent Card Specific Styles */
        .agent-card {
            background-color: var(--color-background-element); /* Distinct solid background for cards */
            border: 1px solid var(--color-border-primary);
            border-radius: 0.375rem; /* rounded-md */
            padding: 0.85rem; /* Compact padding */
            transition: all 0.2s ease-in-out;
        }
        .agent-card:hover {
            background-color: var(--color-background-hover);
            border-color: var(--color-border-accent);
            transform: translateY(-2px); /* Subtle lift */
        }

        /* Log Entry Styles */
        .log-entry {
            line-height: 1.4; /* Slightly tighter line height for log readability */
            padding-bottom: 0.25rem; /* pb-1 */
        }
    </style>
    <!-- React and Babel CDNs -->
    <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
    <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        /**
         * Renders a status badge with dynamic styling based on the status prop.
         * Follows Shadcn/Radix UI conventions for compact, informative badges.
         * @param {object} props - Component props.
         * @param {string} props.status - The status string (e.g., 'pending', 'in_progress', 'done', 'failed').
         * @returns {JSX.Element} A styled span element.
         */
        const StatusBadge = ({ status }) => {
            let className = "status-badge ";
            let text = status.replace(/_/g, ' ');

            switch (status) {
                case 'pending': className += 'pending'; break;
                case 'in_progress': className += 'in_progress'; break;
                case 'done': className += 'done'; break;
                case 'failed': className += 'failed'; break;
                default: className += 'bg-gray-600 text-gray-300'; // Fallback
            }
            return <span className={className} aria-label={`Task status: ${text}`}>{text}</span>;
        };

        /**
         * Displays the daemon's health status and latency.
         * @param {object} props - Component props.
         * @param {string} props.status - The overall system status (e.g., 'Online', 'Offline').
         * @param {string} props.latency - Current system latency in ms.
         * @returns {JSX.Element} A div with status indicator and text.
         */
        const DaemonHealthIndicator = ({ status, latency }) => {
            const colorClass = status === 'Online' ? 'bg-[var(--color-accent-success)]' : 'bg-[var(--color-accent-failed)]';
            return (
                <div className="flex items-center text-sm font-medium text-[var(--color-text-secondary)]" aria-live="polite">
                    <span className={`w-2.5 h-2.5 rounded-full ${colorClass} mr-2 ${status === 'Online' ? 'animate-pulse' : ''}`} aria-hidden="true"></span>
                    <span>System Status: <span className="text-[var(--color-text-primary)]">{status}</span></span>
                    {status === 'Online' && <span className="ml-4">Latency: <span className="text-[var(--color-text-primary)]">{latency}ms</span></span>}
                </div>
            );
        };

        /**
         * Renders a card displaying an individual agent's status and current task.
         * @param {object} props - Component props.
         * @param {string} props.agentId - The unique ID of the agent (e.g., 'D1').
         * @param {string} props.name - The full name of the agent.
         * @param {string|null} props.currentTask - The task description if active, null if idle.
         * @param {string} props.status - The agent's activity status (e.g., 'Active', 'Idle').
         * @returns {JSX.Element} A div representing the agent card.
         */
        const AgentCard = ({ agentId, name, currentTask, status }) => {
            const statusColor = status === 'Active' ? 'text-[var(--color-accent-success)]' : 'text-[var(--color-text-secondary)]';
            const statusDot = status === 'Active' ? 'bg-[var(--color-accent-success)]' : 'bg-[var(--color-border-primary)]'; // Use a darker grey for idle dot
            return (
                <div className="agent-card flex flex-col" aria-label={`Agent ${agentId} status: ${status}. Current task: ${currentTask || 'Idle'}.`}>
                    <div className="flex items-center justify-between mb-1">
                        <span className="text-base font-semibold text-[var(--color-text-primary)] font-mono">{agentId}</span> {/* Slightly larger ID */}
                        <div className="flex items-center text-xs">
                            <span className={`w-2 h-2 rounded-full ${statusDot} mr-1`} aria-hidden="true"></span>
                            <span className={`${statusColor} font-medium`}>{status}</span>
                        </div>
                    </div>
                    <span className="text-xs text-[var(--color-text-secondary)] truncate" title={currentTask ? `${name}: ${currentTask}` : `${name}: Idle`}>
                        {currentTask ? `Task: ${currentTask}` : 'Idle'}
                    </span>
                </div>
            );
        };

        /**
         * Main application component for the WESA Agent Ecosystem Dashboard.
         * Manages state for tasks, agents, and logs, and orchestrates layout.
         * @returns {JSX.Element} The complete dashboard UI.
         */
        const App = () => {
            // Placeholder data for demonstration
            const [tasks, setTasks] = useState([
                { id: 'T-00129', agent: 'D1', status: 'in_progress', started: '2024-07-26 10:35:10', duration: '0m 45s', progress: '30%', type: 'Code Gen & Review' },
                { id: 'T-00128', agent: 'W1', status: 'in_progress', started: '2024-07-26 10:33:40', duration: '2m 15s', progress: '65%', type: 'Drafting Report V2' },
                { id: 'T-00127', agent: 'UX1', status: 'in_progress', started: '2024-07-26 10:32:00', duration: '1m 55s', progress: '80%', type: 'Wireframe Refinement' },
                { id: 'T-00126', agent: '-', status: 'pending', started: '2024-07-26 10:31:20', duration: '-', progress: '-', type: 'Model Training (XL)' },
                { id: 'T-00125', agent: 'R1', status: 'done', started: '2024-07-26 10:30:10', duration: '1m 45s', progress: '100%', type: 'Market Research Query' },
                { id: 'T-00124', agent: 'FE1', status: 'failed', started: '2024-07-26 10:28:30', duration: '1m 20s', progress: 'Error', type: 'Frontend Build & Deploy' },
                { id: 'T-00123', agent: 'D1', status: 'done', started: '2024-07-26 10:25:00', duration: '3m 15s', progress: '100%', type: 'Database Migration' },
                { id: 'T-00122', agent: 'W1', status: 'done', started: '2024-07-26 10:22:05', duration: '4m 00s', progress: '100%', type: 'Content Localization' },
                { id: 'T-00121', agent: 'UX1', status: 'done', started: '2024-07-26 10:20:15', duration: '2m 30s', progress: '100%', type: 'User Flow Diagram' },
                { id: 'T-00120', agent: 'R1', status: 'pending', started: '2024-07-26 10:18:00', duration: '-', progress: '-', type: 'API Documentation' },
            ]);

            const [agents, setAgents] = useState([
                { id: 'D1', name: 'Code Agent Alpha', currentTask: 'T-00129 (Code Gen & Review)', status: 'Active' },
                { id: 'W1', name: 'Writer Agent Beta', currentTask: 'T-00128 (Drafting Report V2)', status: 'Active' },
                { id: 'R1', name: 'Research Agent Gamma', currentTask: null, status: 'Idle' },
                { id: 'UX1', name: 'Design Agent Delta', currentTask: 'T-00127 (Wireframe Refinement)', status: 'Active' },
                { id: 'FE1', name: 'Frontend Agent Epsilon', currentTask: null, status: 'Idle' },
                { id: 'A2', name: 'Analytics Agent', currentTask: 'Analyzing User Metrics', status: 'Active' },
                { id: 'S3', name: 'Security Agent', currentTask: null, status: 'Idle' },
            ]);

            const [logs, setLogs] = useState([
                { timestamp: '10:36:10', level: 'INFO', message: 'Agent D1 initiated code review for new module in T-00129.' },
                { timestamp: '10:35:55', level: 'INFO', message: 'Agent D1 processing new code block for T-00129. Progress: 30%.' },
                { timestamp: '10:35:30', level: 'WARN', message: 'Agent W1 detected data anomaly in source for T-00128. Manual review of data source recommended.' },
                { timestamp: '10:35:10', level: 'INFO', message: 'Agent D1 initiated task T-00129: Code Generation & Review.' },
                { timestamp: '10:34:50', level: 'INFO', message: 'Agent UX1 applied design changes to wireframes for T-00127. Next: stakeholder feedback integration.' },
                { timestamp: '10:34:00', level: 'INFO', message: 'Task T-00130 added to queue: A/B Test Analysis.' },
                { timestamp: '10:33:40', level: 'INFO', message: 'Agent W1 began drafting report for T-00128.' },
                { timestamp: '10:32:00', level: 'INFO', message: 'Agent UX1 started task T-00127: Wireframe Refinement.' },
                { timestamp: '10:31:50', level: 'ERROR', message: 'Agent FE1 encountered critical build error for T-00124 (dependency conflict). Attempting automated rollback.' },
                { timestamp: '10:31:20', level: 'INFO', message: 'Task T-00126 added to queue: Model Training (XL) with GPU cluster allocation.' },
                { timestamp: '10:30:10', level: 'SUCCESS', message: 'Agent R1 successfully completed T-00125: Market Research Query. Results saved to /reports/R1-20240726.json' },
                { timestamp: '10:29:45', level: 'INFO', message: 'Agent D1 completed database schema validation for T-00123.' },
                { timestamp: '10:28:30', level: 'ERROR', message: 'Agent FE1 failed to start task T-00124: Frontend Build & Deploy (Port 3000 in use).' },
                { timestamp: '10:27:00', level: 'INFO', message: 'Agent R1 processing extensive market data for T-00125.' },
                { timestamp: '10:26:30', level: 'INFO', message: 'Agent D1 performing final checks for T-00123.' },
                { timestamp: '10:25:00', level: 'INFO', message: 'Agent D1 initiated database migration for T-00123.' },
                { timestamp: '10:24:00', level: 'WARN', message: 'High memory usage detected on Agent W1 during content processing. Optimization recommended for future tasks.' },
                { timestamp: '10:23:00', level: 'INFO', message: 'Agent UX1 idle, awaiting new design tasks.' },
                { timestamp: '10:22:00', level: 'INFO', message: 'Agent FE1 idle.' },
                { timestamp: '10:21:00', level: 'INFO', message: 'Agent R1 started task T-00125.' },
                { timestamp: '10:20:00', level: 'SUCCESS', message: 'Agent W1 completed task T-00122: Content Localization.' },
            ]);

            // Auto-scroll to bottom of log panel on new log entries
            useEffect(() => {
                const logPanel = document.getElementById('log-panel-body');
                if (logPanel) {
                    logPanel.scrollTop = logPanel.scrollHeight;
                }
            }, [logs]);

            return (
                <div className="min-h-screen bg-[var(--color-background-primary)] text-[var(--color-text-primary)] font-inter text-sm flex flex-col">
                    {/* Dashboard Header */}
                    <header className="flex-shrink-0 panel header-panel mb-4" aria-label="Dashboard Header">
                        <div className="flex items-center justify-between h-full">
                            <DaemonHealthIndicator status="Online" latency="12" />
                            <h1 className="text-xl lg:text-2xl font-bold text-[var(--color-text-primary)] tracking-wide" aria-live="polite">WESA Agent Ecosystem Dashboard</h1>
                            <div className="flex items-center">
                                <svg className="w-5 h-5 mr-2 text-[var(--color-text-secondary)]" fill="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                                    <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-6h2v6zm0-8h-2V7h2v2z" />
                                </svg>
                                <span className="text-sm font-medium text-[var(--color-text-secondary)]">WESA Corp.</span>
                            </div>
                        </div>
                    </header>

                    {/* Main Content Grid Area */}
                    <main className="flex-grow grid grid-cols-1 lg:grid-cols-3 gap-4 px-4 pb-4 auto-rows-min"> {/* Added px-4 pb-4 to main */}
                        {/* Agent Overview Panel */}
                        <section className="panel col-span-1" aria-labelledby="agent-overview-title">
                            <h2 id="agent-overview-title" className="text-xl font-semibold mb-4 text-[var(--color-text-primary)] tracking-tight">Agent Overview</h2>
                            <div className="grid grid-cols-1 md:grid-cols-2 gap-3">
                                {agents.map(agent => (
                                    <AgentCard key={agent.id} {...agent} />

                        </section>

                        {/* Live Task Queue Panel */}
                        <section className="panel col-span-1 lg:col-span-2 flex flex-col" aria-labelledby="task-queue-title">
                            <h2 id="task-queue-title" className="text-xl font-semibold mb-4 text-[var(--color-text-primary)] tracking-tight">Live Task Queue</h2>
                            <div className="flex-grow overflow-hidden border border-[var(--color-border-primary)] rounded-md custom-scrollbar table-panel-container"> {/* Container for table with scroll */}
                                <table className="w-full text-left table-auto border-collapse table-fixed-header">
                                    <thead className="text-xs uppercase">
                                        <tr>
                                            <th className="py-3 px-4 w-[12%] min-w-[80px]">Task ID</th>
                                            <th className="py-3 px-4 w-[8%] min-w-[60px]">Agent</th>
                                            <th className="py-3 px-4 w-[12%] min-w-[90px]">Status</th>
                                            <th className="py-3 px-4 w-[20%] min-w-[120px]">Type</th>
                                            <th className="py-3 px-4 w-[20%] min-w-[150px]">Started At</th>
                                            <th className="py-3 px-4 w-[10%] min-w-[70px]">Duration</th>
                                            <th className="py-3 px-4 w-[10%] min-w-[70px] text-right">Progress</th>
                                        </tr>
                                    </thead>
                                    <tbody className="font-mono text-xs text-[var(--color-text-secondary)]">
                                        {tasks.map(task => (
                                            <tr key={task.id} className="border-b border-[var(--color-border-primary)] hover:bg-[var(--color-background-hover)] transition-colors duration-150">
                                                <td className="py-2.5 px-4 font-semibold text-[var(--color-text-primary)]">{task.id}</td>
                                                <td className="py-2.5 px-4">{task.agent}</td>
                                                <td className="py-2.5 px-4"><StatusBadge status={task.status} /></td>
                                                <td className="py-2.5 px-4">{task.type}</td>
                                                <td className="py-2.5 px-4">{task.started}</td>
                                                <td className="py-2.5 px-4">{task.duration}</td>
                                                <td className="py-2.5 px-4 text-right">{task.progress}</td>
                                            </tr>
                                        ))}
                                    </tbody>
                                </table>
                            </div>
                        </section>
                    </main>

                    {/* Agent Activity Stream Panel (Log Output) */}
                    <section className="flex-shrink-0 panel mx-4 mb-4 min-h-[300px] flex flex-col" aria-labelledby="activity-stream-title"> {/* Added mx-4 mb-4 for consistency */}

                        <div id="log-panel-body" className="font-mono text-xs flex-grow overflow-y-auto custom-scrollbar" role="log" aria-live="polite">
                            {logs.map((log, index) => {
                                let levelColor = 'text-[var(--color-text-secondary)]';
                                switch (log.level) {
                                    case 'INFO': levelColor = 'text-[var(--color-accent-info)]'; break;
                                    case 'WARN': levelColor = 'text-[var(--color-accent-pending)]'; break;
                                    case 'ERROR': levelColor = 'text-[var(--color-accent-failed)]'; break;
                                    case 'SUCCESS': levelColor = 'text-[var(--color-accent-success)]'; break;
                                    default: levelColor = 'text-[var(--color-text-secondary)]';
                                }
                                return (
                                    <p key={index} className="log-entry" aria-label={`${log.level} at ${log.timestamp}: ${log.message}`}>
                                        <span className="text-[var(--color-text-secondary)] mr-2">[{log.timestamp}]</span>
                                        <span className={`${levelColor} font-semibold mr-2`}>[{log.level}]</span>
                                        <span className="text-[var(--color-text-primary)]">{log.message}</span>
                                    </p>
                                );
                            })}
                        </div>
                    </section>
                </div>
            );
        };

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
