<!DOCTYPE html>
<html>
<head>
    <!-- 
    DESIGN RATIONALE:
    
    1.  Three Most Important Design Decisions:
        a.  Near-black background with stark white/neon text: This creates a high-contrast, urgent, and focused environment, minimizing eye strain during long monitoring sessions and making critical information immediately pop. It directly aligns with the "Tactical Clarity" concept and mission control aesthetics, where quick visual parsing is paramount. The dark theme reduces glare and eye fatigue, while bright accents draw attention to actionable states.
        b.  Strong Grid and Distinct Zones: Information is spatially separated into clear, self-contained modules (Daemon Health, Task Queue, Task Log). This engineered layout prevents clutter, enhances scannability, and visually reinforces the idea of precise, compartmentalized system monitoring. Each zone serves a specific purpose, allowing the user to quickly locate the type of information they need without cognitive overhead.
        c.  Semantic Use of Color and Typography: Neon green (#39FF14) is used for active/success states, a vivid red (#FF3333) for critical alerts/failures, and a warning yellow (#FFFF33) for potential issues. Typography employs Montserrat for its geometric strength in headings and labels, conveying decisiveness. Space Mono is used for log output and technical details, its fixed-width nature ensuring precise alignment and readability for code-like information, essential for debugging. Every color and font choice serves a functional, not merely decorative, role, guiding the user's attention efficiently.
    
    2.  Why Font Choices Serve This Concept:
        *   Montserrat (sans-serif): Chosen for its strong, geometric, and modern aesthetic. Its clean lines and varied weights (especially bold and semi-bold) allow for clear visual hierarchy in titles, labels, and primary information, directly supporting the "decisive" and "focused" aspects of Tactical Clarity. It's highly readable, even at smaller sizes, which is crucial for dense monitoring interfaces where information needs to be consumed quickly.
        *   Space Mono (monospace): Selected for its blocky, fixed-width character, ideal for displaying technical data such as task IDs, timestamps, and log output. This font evokes a terminal interface, reinforcing the "mission control" and "engineering" feel. Its uniform character spacing ensures alignment and readability for sequential data, making it easier to parse logs and spot patterns or errors quickly, aligning with the "precision" aspect of tactical monitoring.
    
    3.  What Makes This Layout Specific to a Monitoring Dashboard vs a Generic Dashboard:
        *   Real-time Focus and Alert Prominence: The layout is designed to highlight dynamic, real-time data streams and critical alerts. The "Daemon Health" section is a prominent, always-visible module that instantly communicates overall system vitality. Status indicators for tasks and daemon health use high-contrast, semantic colors that are visually dominant when active (e.g., a flashing red for critical failure), forcing immediate user attention.
        *   Information Density for Operational Context: It skillfully balances information density with scannability. Critical operational data (task status, agent assignment, log output) is tightly integrated into distinct, interconnected zones. The layout enables a rapid "glance-assess-drill down" workflow, where a user can quickly identify an issue in the task queue, select it, and immediately see the corresponding logs without navigating away, essential for a user who needs to react fast.
        *   Action-Oriented Visual Language: The entire visual language—from the stark background to the neon accents and precise typography—is geared towards action and rapid response. The layout isn't just about displaying data; it's about facilitating quick decision-making and problem-solving. It prioritizes the most actionable information, making it impossible to miss critical system states and supporting the user's primary goal of maintaining operational stability.
    -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WESA Agent Ecosystem Monitoring</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Custom Tailwind Config (to use custom fonts and colors) -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Montserrat', 'sans-serif'],
                        mono: ['Space Mono', 'monospace'],
                    },
                    colors: {
                        primaryBg: '#0A0A0A',       // Near-black background
                        secondaryBg: '#1A1A1A',     // Slightly lighter for cards/panels
                        tertiaryBg: '#2A2A2A',      // Even lighter for active/hover states
                        accentGreen: '#39FF14',     // Neon green for success/active
                        accentRed: '#FF3333',       // Vivid red for error/critical
                        accentYellow: '#FFFF33',    // Bright yellow for warning
                        accentBlue: '#00BFFF',      // Cyan for info/pending
                        borderDark: '#333333',      // Darker border/divider
                        textLight: '#E0E0E0',       // Light gray for general text
                        textDim: '#A0A0A0',         // Dim gray for secondary text
                    }
                }
            }
        }
    </script>

    <!-- Custom Styles -->
    <style>
        body {
            font-family: 'Montserrat', sans-serif;
            background-color: var(--primaryBg);
            color: var(--textLight);
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        /* Custom scrollbar for log area */
        .custom-scrollbar::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }

        .custom-scrollbar::-webkit-scrollbar-track {
            background: var(--secondaryBg);
            border-radius: 4px;
        }

        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: var(--borderDark);
            border-radius: 4px;
        }

        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: var(--textDim);
        }

        /* Keyframe for flashing critical elements */
        @keyframes flashRed {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        .flash-red {
            animation: flashRed 1s infinite alternate;
        }

        /* Table specific styles for alternating rows and hover */
        .task-table tbody tr:nth-child(odd) {
            background-color: var(--secondaryBg);
        }
        .task-table tbody tr:nth-child(even) {
            background-color: var(--primaryBg);
        }
        .task-table tbody tr:hover {
            background-color: var(--tertiaryBg);
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <!-- React, ReactDOM, Babel CDNs -->
    <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
    <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // Semantic Status Component
        const StatusIndicator = ({ status, text }) => {
            let colorClass = '';
            let dotColor = '';
            switch (status) {
                case 'online':
                case 'active':
                case 'done':
                case 'success':
                    colorClass = 'text-accentGreen';
                    dotColor = 'bg-accentGreen';
                    break;
                case 'in_progress':
                case 'pending':
                    colorClass = 'text-accentBlue';
                    dotColor = 'bg-accentBlue';
                    break;
                case 'warning':
                    colorClass = 'text-accentYellow';
                    dotColor = 'bg-accentYellow';
                    break;
                case 'failed':
                case 'offline':
                case 'critical':
                    colorClass = 'text-accentRed font-bold';
                    dotColor = 'bg-accentRed';
                    break;
                default:
                    colorClass = 'text-textDim';
                    dotColor = 'bg-textDim';
            }
            return (
                <span className={`inline-flex items-center text-sm ${colorClass}`}>
                    <span className={`w-2 h-2 rounded-full mr-2 ${dotColor}`}></span>
                    {text || status.replace(/_/g, ' ')}
                </span>
            );
        };

        // Daemon Health Component
        const DaemonHealth = ({ healthData }) => {
            const isCritical = healthData.status === 'offline';
            const agentWarning = healthData.agentsActive < healthData.agentsTotal / 2 && healthData.agentsActive > 0;
            const statusClass = isCritical ? 'bg-accentRed bg-opacity-10 border border-accentRed' : 'bg-secondaryBg border border-borderDark';

            return (
                <div className={`p-6 rounded-lg ${statusClass} transition-colors duration-200`}>
                    <h2 className="text-xl font-bold text-textLight mb-4 flex items-center">
                        Daemon Health
                        {isCritical && <span className="ml-2 text-accentRed text-xs font-mono bg-accentRed bg-opacity-20 px-2 py-1 rounded flash-red">CRITICAL</span>}
                        {agentWarning && !isCritical && <span className="ml-2 text-accentYellow text-xs font-mono bg-accentYellow bg-opacity-20 px-2 py-1 rounded">WARNING</span>}
                    </h2>
                    <div className="grid grid-cols-2 gap-4">
                        <div>
                            <div className="text-sm text-textDim mb-1">Overall Status</div>
                            <StatusIndicator status={healthData.status} text={healthData.status.toUpperCase()} />
                        </div>
                        <div>
                            <div className="text-sm text-textDim mb-1">Uptime</div>
                            <div className="font-mono text-textLight text-lg">{healthData.uptime}</div>
                        </div>
                        <div>
                            <div className="text-sm text-textDim mb-1">CPU Usage</div>
                            <div className="font-mono text-textLight text-lg">{healthData.cpuUsage}%</div>
                        </div>
                        <div>
                            <div className="text-sm text-textDim mb-1">Memory Usage</div>
                            <div className="font-mono text-textLight text-lg">{healthData.memoryUsage}GB</div>
                        </div>
                        <div className="col-span-2">
                            <div className="text-sm text-textDim mb-1">Agent Pool</div>
                            <div className="font-mono text-textLight text-lg">
                                <span className={isCritical ? 'text-accentRed' : (agentWarning ? 'text-accentYellow' : 'text-accentGreen')}>
                                    {healthData.agentsActive}
                                </span> / {healthData.agentsTotal} Active
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        // Task Queue Component
        const TaskQueue = ({ tasks, onTaskSelect, selectedTaskId }) => {
            const generateDuration = (startTime, endTime) => {
                if (!startTime) return 'N/A';
                const start = new Date(startTime);
                const end = endTime ? new Date(endTime) : new Date();
                const diffMs = end - start;
                const totalSeconds = Math.floor(diffMs / 1000);

                const hours = Math.floor(totalSeconds / 3600);
                const minutes = Math.floor((totalSeconds % 3600) / 60);
                const seconds = totalSeconds % 60;

                let durationStr = '';
                if (hours > 0) durationStr += `${hours}h `;
                if (minutes > 0 || hours > 0) durationStr += `${minutes}m `;
                durationStr += `${seconds}s`;
                return durationStr.trim();
            };

            return (
                <div className="bg-secondaryBg p-6 rounded-lg border border-borderDark flex flex-col h-full">
                    <h2 className="text-xl font-bold text-textLight mb-4">Task Queue</h2>
                    <div className="overflow-x-auto custom-scrollbar flex-grow">
                        <table className="min-w-full text-sm task-table">
                            <thead>
                                <tr className="text-textDim uppercase text-left font-semibold border-b border-borderDark">
                                    <th className="py-2 px-4 whitespace-nowrap">Task ID</th>
                                    <th className="py-2 px-4 whitespace-nowrap">Agent</th>
                                    <th className="py-2 px-4 whitespace-nowrap">Status</th>
                                    <th className="py-2 px-4 whitespace-nowrap">Start Time</th>
                                    <th className="py-2 px-4 whitespace-nowrap">Duration</th>
                                </tr>
                            </thead>
                            <tbody>
                                {tasks.length === 0 ? (
                                    <tr>
                                        <td colSpan="5" className="py-4 px-4 text-center text-textDim">No tasks in queue.</td>
                                    </tr>
                                ) : (
                                    tasks.map(task => (
                                        <tr 
                                            key={task.id} 
                                            className={`${task.id === selectedTaskId ? 'bg-tertiaryBg border-l-4 border-accentGreen' : ''}`}
                                            onClick={() => onTaskSelect(task)}
                                        >
                                            <td className="py-2 px-4 font-mono text-textLight">{task.id}</td>
                                            <td className="py-2 px-4 text-textLight">{task.agent || 'N/A'}</td>
                                            <td className="py-2 px-4"><StatusIndicator status={task.status} /></td>
                                            <td className="py-2 px-4 font-mono text-textDim">{new Date(task.startTime).toLocaleTimeString()}</td>
                                            <td className="py-2 px-4 font-mono text-textDim">
                                                {generateDuration(task.startTime, task.status === 'done' || task.status === 'failed' ? task.endTime : null)}
                                            </td>
                                        </tr>
                                    ))
                                )}
                            </tbody>
                        </table>
                    </div>
                </div>
            );
        };

        // Task Log Component
        const TaskLog = ({ selectedTask }) => {
            const [activeTab, setActiveTab] = useState('overview'); // 'overview', 'raw', 'errors'
            const logEndRef = useRef(null);

            useEffect(() => {
                if (logEndRef.current) {
                    logEndRef.current.scrollIntoView({ behavior: 'smooth', block: 'end' });
                }
            }, [selectedTask, activeTab, selectedTask?.log.length]);

            const renderLogContent = () => {
                if (!selectedTask) {
                    return <div className="text-textDim p-4">Select a task to view logs.</div>;
                }

                switch (activeTab) {
                    case 'overview':
                        return (
                            <div className="p-4 space-y-3">
                                <div className="flex items-center">
                                    <span className="text-textDim mr-2">Status:</span>
                                    <StatusIndicator status={selectedTask.status} />
                                </div>
                                <div className="flex">
                                    <span className="text-textDim mr-2">Assigned Agent:</span>
                                    <span className="font-mono text-textLight">{selectedTask.agent || 'N/A'}</span>
                                </div>
                                <div className="flex">
                                    <span className="text-textDim mr-2">Start Time:</span>
                                    <span className="font-mono text-textLight">{new Date(selectedTask.startTime).toLocaleString()}</span>
                                </div>
                                {selectedTask.endTime && (
                                    <div className="flex">
                                        <span className="text-textDim mr-2">End Time:</span>
                                        <span className="font-mono text-textLight">{new Date(selectedTask.endTime).toLocaleString()}</span>
                                    </div>
                                )}
                                {selectedTask.duration && (
                                    <div className="flex">
                                        <span className="text-textDim mr-2">Duration:</span>
                                        <span className="font-mono text-textLight">{selectedTask.duration}</span>
                                    </div>
                                )}
                                <p className="text-textDim pt-4">Latest Log Snippet:</p>
                                <pre className="font-mono text-sm text-textLight bg-primaryBg p-3 rounded overflow-auto custom-scrollbar max-h-48 whitespace-pre-wrap">
                                    {selectedTask.log.length > 0 ? selectedTask.log[selectedTask.log.length - 1] : 'No log entries yet.'}
                                </pre>
                            </div>
                        );
                    case 'raw':
                        return (
                            <pre className="font-mono text-sm text-textLight p-4 whitespace-pre-wrap custom-scrollbar overflow-y-auto h-full">
                                {selectedTask.log.map((line, index) => {
                                    let lineClass = 'text-textLight';
                                    if (line.includes('[ERROR]')) lineClass = 'text-accentRed';
                                    else if (line.includes('[WARNING]')) lineClass = 'text-accentYellow';
                                    else if (line.includes('[SUCCESS]')) lineClass = 'text-accentGreen';
                                    else if (line.includes('[INFO]')) lineClass = 'text-accentBlue';
                                    return <div key={index} className={lineClass}>{line}</div>;
                                })}
                                <div ref={logEndRef} />
                            </pre>
                        );
                    case 'errors':
                        const errors = selectedTask.log.filter(line => line.includes('[ERROR]'));
                        return (
                            <pre className="font-mono text-sm text-textLight p-4 whitespace-pre-wrap custom-scrollbar overflow-y-auto h-full">
                                {errors.length > 0 ? (
                                    errors.map((line, index) => <div key={index} className="text-accentRed">{line}</div>)
                                ) : (
                                    <div className="text-textDim">No error entries found for this task.</div>
                                )}
                                <div ref={logEndRef} />
                            </pre>
                        );
                    default:
                        return null;
                }
            };

            const tabClass = (tabName) => 
                `px-4 py-2 text-sm font-semibold cursor-pointer border-b-2 transition-colors duration-150 ` +
                (activeTab === tabName 
                    ? 'border-accentGreen text-accentGreen' 
                    : 'border-transparent text-textDim hover:text-textLight hover:border-textDim');

            return (
                <div className="bg-secondaryBg rounded-lg border border-borderDark flex flex-col h-full">
                    <div className="flex border-b border-borderDark">
                        <button className={tabClass('overview')} onClick={() => setActiveTab('overview')}>Overview</button>
                        <button className={tabClass('raw')} onClick={() => setActiveTab('raw')}>Raw Log</button>
                        <button className={tabClass('errors')} onClick={() => setActiveTab('errors')}>Errors</button>
                        <h2 className="text-lg font-bold text-textLight py-2 pl-4 flex-grow items-center flex">
                           {selectedTask ? `Task ${selectedTask.id}` : 'Task Log'}
                        </h2>
                    </div>
                    <div className="flex-grow overflow-hidden relative">
                        {renderLogContent()}
                    </div>
                </div>
            );
        };

        // Main App Component
        const App = () => {
            const [daemonHealth, setDaemonHealth] = useState({
                status: 'online',
                uptime: '2d 14h 32m',
                cpuUsage: 15,
                memoryUsage: 3.2,
                agentsActive: 6,
                agentsTotal: 8,
            });

            const initialTasks = [
                { id: 'WES-001', agent: 'Agent Alpha', status: 'done', startTime: new Date(Date.now() - 3600 * 1000).toISOString(), endTime: new Date(Date.now() - 3500 * 1000).toISOString(), duration: '1m 40s', log: [`[INFO] ${new Date(Date.now() - 3600 * 1000).toLocaleTimeString()} Task WES-001 started.`, `[INFO] ${new Date(Date.now() - 3550 * 1000).toLocaleTimeString()} Processing data chunk 1/5...`, `[INFO] ${new Date(Date.now() - 3520 * 1000).toLocaleTimeString()} Processing data chunk 2/5...`, `[SUCCESS] ${new Date(Date.now() - 3500 * 1000).toLocaleTimeString()} Task WES-001 completed successfully.`] },
                { id: 'WES-002', agent: 'Agent Beta', status: 'in_progress', startTime: new Date(Date.now() - 120 * 1000).toISOString(), endTime: null, duration: null, log: [`[INFO] ${new Date(Date.now() - 120 * 1000).toLocaleTimeString()} Task WES-002 started.`, `[INFO] ${new Date(Date.now() - 90 * 1000).toLocaleTimeString()} Fetching external resource...`, `[WARNING] ${new Date(Date.now() - 50 * 1000).toLocaleTimeString()} External resource response slow.`, `[INFO] ${new Date(Date.now() - 20 * 1000).toLocaleTimeString()} Data processing in progress...`] },
                { id: 'WES-003', agent: 'Agent Gamma', status: 'pending', startTime: new Date(Date.now() - 30 * 1000).toISOString(), endTime: null, duration: null, log: [`[INFO] ${new Date(Date.now() - 30 * 1000).toLocaleTimeString()} Task WES-003 queued.`] },
                { id: 'WES-004', agent: 'Agent Delta', status: 'failed', startTime: new Date(Date.now() - 600 * 1000).toISOString(), endTime: new Date(Date.now() - 580 * 1000).toISOString(), duration: '20s', log: [`[INFO] ${new Date(Date.now() - 600 * 1000).toLocaleTimeString()} Task WES-004 started.`, `[ERROR] ${new Date(Date.now() - 595 * 1000).toLocaleTimeString()} Database connection failed. Retrying...`, `[ERROR] ${new Date(Date.now() - 590 * 1000).toLocaleTimeString()} Database connection failed after 3 retries. Aborting task.`, `[CRITICAL] ${new Date(Date.now() - 580 * 1000).toLocaleTimeString()} Task WES-004 failed: DB_CONNECTION_ERROR.`] },
                { id: 'WES-005', agent: 'Agent Alpha', status: 'done', startTime: new Date(Date.now() - 7200 * 1000).toISOString(), endTime: new Date(Date.now() - 7100 * 1000).toISOString(), duration: '1m 20s', log: [`[INFO] ${new Date(Date.now() - 7200 * 1000).toLocaleTimeString()} Task WES-005 started.`, `[INFO] ${new Date(Date.now() - 7150 * 1000).toLocaleTimeString()} Data validated.`, `[SUCCESS] ${new Date(Date.now() - 7100 * 1000).toLocaleTimeString()} Task WES-005 finished.`] },
                { id: 'WES-006', agent: 'Agent Gamma', status: 'in_progress', startTime: new Date(Date.now() - 240 * 1000).toISOString(), endTime: null, duration: null, log: [`[INFO] ${new Date(Date.now() - 240 * 1000).toLocaleTimeString()} Task WES-006 started.`, `[INFO] ${new Date(Date.now() - 200 * 1000).toLocaleTimeString()} Initializing AI model...`, `[INFO] ${new Date(Date.now() - 150 * 1000).toLocaleTimeString()} Model loaded successfully. Starting inference.`] },
                { id: 'WES-007', agent: 'Agent Beta', status: 'pending', startTime: new Date(Date.now() - 10 * 1000).toISOString(), endTime: null, duration: null, log: [`[INFO] ${new Date(Date.now() - 10 * 1000).toLocaleTimeString()} Task WES-007 queued.`] },
                { id: 'WES-008', agent: 'Agent Delta', status: 'done', startTime: new Date(Date.now() - 1800 * 1000).toISOString(), endTime: new Date(Date.now() - 1700 * 1000).toISOString(), duration: '1m 5s', log: [`[INFO] ${new Date(Date.now() - 1800 * 1000).toLocaleTimeString()} Task WES-008 started.`, `[INFO] ${new Date(Date.now() - 1750 * 1000).toLocaleTimeString()} Processing report...`, `[SUCCESS] ${new Date(Date.now() - 1700 * 1000).toLocaleTimeString()} Report generated and stored.`] },
                { id: 'WES-009', agent: 'Agent Alpha', status: 'in_progress', startTime: new Date(Date.now() - 90 * 1000).toISOString(), endTime: null, duration: null, log: [`[INFO] ${new Date(Date.now() - 90 * 1000).toLocaleTimeString()} Task WES-009 started.`, `[INFO] ${new Date(Date.now() - 60 * 1000).toLocaleTimeString()} Analyzing input stream...`, `[WARNING] ${new Date(Date.now() - 30 * 1000).toLocaleTimeString()} High latency detected in stream source.`] },
                { id: 'WES-010', agent: 'Agent Beta', status: 'failed', startTime: new Date(Date.now() - 300 * 1000).toISOString(), endTime: new Date(Date.now() - 290 * 1000).toISOString(), duration: '10s', log: [`[INFO] ${new Date(Date.now() - 300 * 1000).toLocaleTimeString()} Task WES-010 started.`, `[ERROR] ${new Date(Date.now() - 295 * 1000).toLocaleTimeString()} File system write error. Permissions issue?`, `[ERROR] ${new Date(Date.now() - 292 * 1000).toLocaleTimeString()} Could not write output to disk. Aborting.`, `[CRITICAL] ${new Date(Date.now() - 290 * 1000).toLocaleTimeString()} Task WES-010 failed: FS_WRITE_ERROR.`] },
            ];
            const [tasks, setTasks] = useState(initialTasks);
            const [selectedTask, setSelectedTask] = useState(initialTasks[1]); // Pre-select an in-progress task

            const simulateUpdates = () => {
                // Simulate daemon health changes
                setDaemonHealth(prevHealth => {
                    const now = new Date();
                    const currentHour = now.getHours();
                    const isMaintenanceWindow = currentHour >= 2 && currentHour < 3; // Simulate offline for 2-3 AM
                    const newStatus = isMaintenanceWindow || Math.random() < 0.005 ? 'offline' : 'online'; // 0.5% chance to go offline outside maintenance
                    const newAgentsActive = newStatus === 'online' 
                        ? Math.max(3, Math.min(prevHealth.agentsTotal, Math.floor(Math.random() * (prevHealth.agentsTotal - 2) + 3))) 
                        : 0;
                    return {
                        ...prevHealth,
                        status: newStatus,
                        cpuUsage: newStatus === 'online' ? Math.floor(Math.random() * 30) + 5 : 0,
                        memoryUsage: newStatus === 'online' ? (Math.random() * 2 + 2).toFixed(1) : 0,
                        agentsActive: newAgentsActive
                    };
                });

                // Simulate task progression
                setTasks(prevTasks => {
                    const updatedTasks = prevTasks.map(task => {
                        const now = new Date();
                        const timeString = now.toLocaleTimeString();

                        if (task.status === 'pending' && Math.random() < 0.3) {
                            // 30% chance to start
                            const agentName = `Agent ${String.fromCharCode(65 + Math.floor(Math.random() * 4))}`;
                            const newTask = { ...task, status: 'in_progress', agent: agentName, startTime: now.toISOString(), endTime: null, duration: null };
                            newTask.log = [...newTask.log, `[INFO] ${timeString} Task ${newTask.id} assigned to ${newTask.agent}, status: in_progress.`];
                            return newTask;
                        }
                        if (task.status === 'in_progress') {
                            if (Math.random() < 0.1) { // 10% chance to fail
                                const endTime = now.toISOString();
                                const durationString = generateDuration(task.startTime, endTime);
                                const newLog = [...task.log, `[ERROR] ${timeString} Critical error during processing.`, `[CRITICAL] ${timeString} Task ${task.id} failed: SIMULATED_FAILURE.`];
                                return { ...task, status: 'failed', endTime, duration: durationString, log: newLog };
                            } else if (Math.random() < 0.2) { // 20% chance to finish
                                const endTime = now.toISOString();
                                const durationString = generateDuration(task.startTime, endTime);
                                const newLog = [...task.log, `[SUCCESS] ${timeString} Task ${task.id} completed successfully.`];
                                return { ...task, status: 'done', endTime, duration: durationString, log: newLog };
                            } else if (Math.random() < 0.5) { // 50% chance to add a normal log
                                const newLog = [...task.log, `[INFO] ${timeString} Processing data for task ${task.id}...`];
                                return { ...task, log: newLog };
                            }
                        }
                        return task;
                    });
                    
                    // Add new task occasionally (only if daemon is online)
                    if (daemonHealth.status === 'online' && Math.random() < 0.05) { // 5% chance to add a new pending task
                        const now = new Date();
                        const timeString = now.toLocaleTimeString();
                        const newTaskCount = prevTasks.length + 1;
                        const newId = `WES-${String(newTaskCount).padStart(3, '0')}`;
                        updatedTasks.unshift({
                            id: newId,
                            agent: null,
                            status: 'pending',
                            startTime: now.toISOString(),
                            endTime: null,
                            duration: null,
                            log: [`[INFO] ${timeString} Task ${newId} queued.`]
                        });
                    }

                    // Keep a reasonable number of tasks, e.g., last 20
                    return updatedTasks.slice(0, 20);
                });
            };

            const generateDuration = (startTime, endTime) => {
                if (!startTime) return 'N/A';
                const start = new Date(startTime);
                const end = endTime ? new Date(endTime) : new Date();
                const diffMs = end - start;
                const totalSeconds = Math.floor(diffMs / 1000);

                const hours = Math.floor(totalSeconds / 3600);
                const minutes = Math.floor((totalSeconds % 3600) / 60);
                const seconds = totalSeconds % 60;

                let durationStr = '';
                if (hours > 0) durationStr += `${hours}h `;
                if (minutes > 0 || hours > 0) durationStr += `${minutes}m `;
                durationStr += `${seconds}s`;
                return durationStr.trim();
            };

            useEffect(() => {
                const interval = setInterval(simulateUpdates, 2000); // Update every 2 seconds
                return () => clearInterval(interval);
            }, [daemonHealth.status]); // Rerun effect if daemon status changes to adjust new task creation logic

            const handleTaskSelect = (task) => {
                setSelectedTask(task);
            };

            const now = new Date();
            const timeString = now.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
            const dateString = now.toLocaleDateString('en-US', { year: 'numeric', month: 'short', day: 'numeric' });

            return (
                <div className="min-h-screen bg-primaryBg text-textLight p-8">
                    {/* Header */}
                    <header className="flex justify-between items-center pb-6 border-b border-borderDark mb-8">
                        <h1 className="text-3xl font-bold text-accentGreen uppercase tracking-wider">WESA Agent Ecosystem</h1>
                        <div className="text-right text-textDim">
                            <div className="font-mono text-xl text-textLight">{timeString}</div>
                            <div className="font-mono text-sm">{dateString}</div>
                            <div className="text-xs">localhost:8765</div>
                        </div>
                    </header>

                    {/* Main Grid Layout */}
                    <main className="grid grid-cols-12 gap-8 h-[calc(100vh-160px)]"> {/* Adjust height based on header/footer */}
                        {/* Left Column (Daemon Health & Task Queue) */}
                        <div className="col-span-8 flex flex-col space-y-8">
                            <div className="h-1/3 min-h-[200px]"> {/* Approx 1/3 height for Daemon Health */}
                                <DaemonHealth healthData={daemonHealth} />
                            </div>
                            <div className="h-2/3 flex-grow"> {/* Approx 2/3 height for Task Queue */}
                                <TaskQueue tasks={tasks} onTaskSelect={handleTaskSelect} selectedTaskId={selectedTask?.id} />
                            </div>
                        </div>

                        {/* Right Column (Task Log) */}
                        <div className="col-span-4 h-full">
                            <TaskLog selectedTask={selectedTask} />
                        </div>
                    </main>
                </div>
            );
        };

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
